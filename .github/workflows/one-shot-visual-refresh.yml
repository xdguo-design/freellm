name: one-shot-visual-refresh

on:
  push:
    branches:
      - feat/site-visual-governance
    paths:
      - ".github/workflows/one-shot-visual-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-visual-governance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest playwright
      - name: Refresh generated site outputs
        run: |
          node scripts/generate_ranking.ts
          python scripts/build_tools_index.py
          python scripts/build_static.py
          python scripts/build_seo_pages.py
      - name: Validate generated outputs and visual contracts
        run: |
          node scripts/generate_ranking.ts --check
          python scripts/build_tools_index.py --check
          python scripts/build_static.py --check
          python scripts/build_seo_pages.py --check
          python -m pytest tests/test_mimo_v26.py tests/test_model_catalog.py tests/test_model_pages.py tests/test_site_visual_system.py -q
      - name: Commit generated output
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "freellm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "build: refresh outputs after visual regression pass"
          git push origin HEAD:feat/site-visual-governance
