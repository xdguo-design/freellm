name: skill-real-tests-build

on:
  push:
    branches: ["feat/skill-real-tests"]
    paths:
      - "data/skill-tests.json"
      - "scripts/build_seo_pages.py"
      - "tests/test_skills_page.py"
      - ".github/workflows/skill-real-tests-build.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/skill-real-tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run skill tests
        run: python -m unittest tests.test_skills_page -v
      - name: Regenerate static output
        run: python scripts/build_static.py
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/index.html skills/lab/index.html sitemap*.xml .seo-pages-manifest.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(skills): regenerate benchmark pages"
            git push origin HEAD:feat/skill-real-tests
          fi
