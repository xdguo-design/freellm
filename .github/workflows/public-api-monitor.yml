name: public-api-evidence-monitor

# Artifact-only probes: no automatic catalog edits, no production deployments.
# A documentation response never implies that a model/API invocation succeeded.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HCNSEC_API_KEY: ${{ secrets.HCNSEC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify evaluation contract (offline)
        run: python -m unittest tests.test_public_api_probe -v
      - name: Check public gateway documentation (never uses a credential)
        run: |
          mkdir -p .tmp/public-api/reports
          python scripts/probe_public_api.py --mode documentation --timeout 12 --output .tmp/public-api/reports/docs.json
      - name: Optional one-request authenticated proof
        if: ${{ env.HCNSEC_API_KEY != '' }}
        run: |
          python scripts/probe_public_api.py --mode authenticated_chat --timeout 15 --output .tmp/public-api/reports/auth.json
      - name: Evaluate evidence without promoting review scores
        if: always()
        run: |
          python scripts/evaluate_public_api.py --observations data/public-api-observations.json --reports-dir .tmp/public-api/reports --output .tmp/public-api/evaluation.json
      - name: Keep scrubbed monitoring evidence for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-evidence-${{ github.run_id }}
          path: .tmp/public-api/
          retention-days: 90
          if-no-files-found: warn
