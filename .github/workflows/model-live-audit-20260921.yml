name: model-live-audit-20260921

on:
  push:
    branches:
      - model-live-audit-20260921

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run live model audit
        run: |
          python - <<'PY'
          import concurrent.futures, json, ssl, time, urllib.error, urllib.request
          from collections import Counter, defaultdict
          from pathlib import Path

          MODELS=json.loads(Path("data/models.json").read_text())
          UA="Mozilla/5.0 (compatible; FreeLLM-live-model-audit/2026-09-21)"
          CTX=ssl.create_default_context()

          def req(url, method="GET", body=None, headers=None, timeout=15):
              data=json.dumps(body).encode() if body is not None else None
              h={"User-Agent":UA,"Accept":"application/json,text/html;q=0.9,*/*;q=0.8"}
              if body is not None: h["Content-Type"]="application/json"
              if headers: h.update(headers)
              r=urllib.request.Request(url,data=data,method=method,headers=h)
              t=time.monotonic()
              try:
                  with urllib.request.urlopen(r,timeout=timeout,context=CTX) as x:
                      raw=x.read(1200).decode("utf-8","replace")
                      return {"status":x.status,"ms":int((time.monotonic()-t)*1000),"body":raw}
              except urllib.error.HTTPError as e:
                  raw=e.read(1200).decode("utf-8","replace")
                  return {"status":e.code,"ms":int((time.monotonic()-t)*1000),"body":raw}
              except Exception as e:
                  return {"status":None,"ms":int((time.monotonic()-t)*1000),"error":type(e).__name__+":"+str(e)[:160]}

          # 1) Every published row: source page reachability. Cache shared URLs.
          urls=sorted({str(m.get("sourceUrl") or "").strip() for m in MODELS if str(m.get("sourceUrl") or "").startswith("http")})
          source_results={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=18) as ex:
              fut={ex.submit(req,u):u for u in urls}
              for f in concurrent.futures.as_completed(fut):
                  source_results[fut[f]]=f.result()

          rows=[]
          for m in MODELS:
              u=str(m.get("sourceUrl") or "")
              r=source_results.get(u,{"status":None,"error":"NO_SOURCE_URL"})
              rows.append({"id":m["id"],"providerId":m.get("providerId"),"sourceUrl":u,"sourceStatus":r.get("status"),"sourceMs":r.get("ms"),"sourceError":r.get("error")})

          # 2) Live official/public catalog scan using repo scanner.
          import subprocess
          subprocess.run([
              "python","scripts/build_model_catalog.py","--date","2026-09-21",
              "--models-out","/tmp/live-models.json","--providers-out","/tmp/live-providers.json",
              "--max-models","1000","--timeout","20"
          ],check=True)
          LIVE=json.loads(Path("/tmp/live-models.json").read_text())
          live_ids={m["id"] for m in LIVE}
          published_ids={m["id"] for m in MODELS}
          missing=sorted(published_ids-live_ids)
          discovered_only=sorted(live_ids-published_ids)

          # 3) Real tiny inference on Kilo anonymous free routes.
          kilo=[]
          for m in MODELS:
              if m.get("providerId")!="kilo": continue
              model=m.get("canonicalModelId")
              if not model: continue
              out=req(
                  "https://api.kilo.ai/api/gateway/v1/chat/completions",
                  "POST",
                  {"model":model,"messages":[{"role":"user","content":"Reply OK"}],"max_tokens":4},
                  {"Authorization":"Bearer sk-anonymous-freellm-audit"},
                  timeout=25,
              )
              kilo.append({"id":m["id"],"model":model,"status":out.get("status"),"ms":out.get("ms"),"body":(out.get("body") or "")[:240],"error":out.get("error")})

          # 4) Read Kilo's live gateway catalogue; marketing pages can lag the API.
          kilo_catalog=req(
              "https://api.kilo.ai/api/gateway/models",
              "GET",
              headers={"Authorization":"Bearer sk-anonymous-freellm-audit"},
              timeout=25,
          )
          kilo_catalog_ids=[]
          kilo_free_ids=[]
          if kilo_catalog.get("status")==200:
              try:
                  parsed=json.loads(kilo_catalog.get("body") or "{}")
                  entries=parsed.get("data") if isinstance(parsed,dict) else parsed
                  for entry in entries or []:
                      if not isinstance(entry,dict): continue
                      mid=str(entry.get("id") or "")
                      if mid: kilo_catalog_ids.append(mid)
                      pricing=entry.get("pricing") or {}
                      prompt=str(pricing.get("prompt") or pricing.get("input") or "")
                      completion=str(pricing.get("completion") or pricing.get("output") or "")
                      if mid and prompt in {"0","0.0","0.00","0.000000"} and completion in {"0","0.0","0.00","0.000000"}:
                          kilo_free_ids.append(mid)
              except Exception as exc:
                  print("KILO_CATALOG_PARSE_ERROR",type(exc).__name__,str(exc)[:200])
          print("KILO_CATALOG_STATUS",kilo_catalog.get("status"),"IDS",len(kilo_catalog_ids),"FREE",len(kilo_free_ids))
          print("KILO_CATALOG_SNIPPET",repr((kilo_catalog.get("body") or "")[:1100]))
          print("KILO_CATALOG_FREE_IDS",kilo_free_ids)

          # 5) Probe today's candidate Kilo free routes before adding them.
          candidates=[
              "minimax/minimax-m2.7:free",
              "minimax/minimax-m3:free",
              "tencent/hy3:free",
              "tencent/hy3-preview:free",
              "inclusionai/ling-2.6-1t:free",
              "inclusionai/ling-2.6-flash:free",
              "inclusionai/ring-2.6-1t:free",
              "inclusionai/ling-3.0-flash:free",
          ]
          candidate_results=[]
          for model in candidates:
              out=req(
                  "https://api.kilo.ai/api/gateway/v1/chat/completions",
                  "POST",
                  {"model":model,"messages":[{"role":"user","content":"Reply OK"}],"max_tokens":4},
                  {"Authorization":"Bearer sk-anonymous-freellm-audit"},
                  timeout=25,
              )
              candidate_results.append({"model":model,"status":out.get("status"),"ms":out.get("ms"),"body":(out.get("body") or "")[:300],"error":out.get("error")})

          # 6) Real tiny inference on LLM7 anonymous route.
          llm7=[]
          for m in MODELS:
              if m.get("providerId")!="llm7-io": continue
              model=m.get("model")
              out=req(
                  "https://api.llm7.io/v1/chat/completions",
                  "POST",
                  {"model":model,"messages":[{"role":"user","content":"Reply OK"}],"max_tokens":4},
                  {"Authorization":"Bearer unused"},
                  timeout=25,
              )
              llm7.append({"id":m["id"],"model":model,"status":out.get("status"),"ms":out.get("ms"),"body":(out.get("body") or "")[:240],"error":out.get("error")})

          def summarize_http(items):
              c=Counter(str(x.get("status")) for x in items)
              return dict(sorted(c.items()))

          report={
              "generatedAt":"2026-09-21",
              "publishedCount":len(MODELS),
              "liveCatalogCount":len(LIVE),
              "sourceUrlUniqueCount":len(urls),
              "sourceReachability":summarize_http(list(source_results.values())),
              "missingFromLiveCatalog":missing,
              "discoveredOnly":discovered_only,
              "kiloInference":{"count":len(kilo),"statuses":summarize_http(kilo),"results":kilo},
              "kiloCatalog":{"status":kilo_catalog.get("status"),"ids":kilo_catalog_ids,"freeIds":kilo_free_ids},
              "candidateKiloInference":{"count":len(candidate_results),"statuses":summarize_http(candidate_results),"results":candidate_results},
              "llm7Inference":{"count":len(llm7),"statuses":summarize_http(llm7),"results":llm7},
              "rows":rows,
          }
          Path("model-live-audit-20260921.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print("PUBLISHED",len(MODELS))
          print("LIVE_CATALOG",len(LIVE))
          print("SOURCE_REACHABILITY",report["sourceReachability"])
          print("MISSING_FROM_LIVE",len(missing),missing)
          print("DISCOVERED_ONLY",len(discovered_only),discovered_only)
          print("KILO",report["kiloInference"]["statuses"])
          for x in kilo:
              print("KILO_MODEL",x["id"],x["status"],x["ms"],repr(x["body"][:120]),x.get("error"))
          print("KILO_CANDIDATES",report["candidateKiloInference"]["statuses"])
          for x in candidate_results:
              print("KILO_CANDIDATE",x["model"],x["status"],x["ms"],repr(x["body"][:160]),x.get("error"))
          print("LLM7",report["llm7Inference"]["statuses"])
          for x in llm7:
              print("LLM7_MODEL",x["id"],x["status"],x["ms"],repr(x["body"][:120]),x.get("error"))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: model-live-audit-20260921
          path: model-live-audit-20260921.json
