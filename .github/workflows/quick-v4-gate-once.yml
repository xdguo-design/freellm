name: quick-v4-gate-once

on:
  push:
    branches:
      - feat/model-library-reference-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-library-reference-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Verify generated output
        run: python scripts/build_seo_pages.py --check
      - name: Run focused v4 browser contracts
        run: |
          python -m unittest -v \
            tests.test_e2e_static.BrowserPageTests.test_file_protocol_renders_embedded_data \
            tests.test_e2e_static.BrowserPageTests.test_primary_pages_use_aurora_and_mobile_without_page_overflow \
            tests.test_e2e_static.BrowserPageTests.test_visual_regression_equal_height_cards_and_home_hierarchy \
            tests.test_e2e_static.BrowserPageTests.test_visual_regression_mobile_chrome_has_no_duplicate_headers_or_overlap \
            tests.test_e2e_static.BrowserPageTests.test_visual_regression_aurora_tokens_on_primary_pages \
            tests.test_e2e_static.BrowserPageTests.test_homepage_aurora_phase_one_visual_contracts \
            tests.test_e2e_static.BrowserPageTests.test_homepage_aurora_phase_one_mobile_layout \
            tests.test_e2e_static.BrowserPageTests.test_resource_free_filter_clears_stale_search \
            tests.test_e2e_static.BrowserPageTests.test_resource_student_filter_uses_unified_catalog \
            tests.test_e2e_static.StaticContractTests.test_catalog_search_indexes_nested_models_and_cards_have_stable_height
      - name: Capture and enforce v4 geometry
        run: |
          python scripts/capture_visual_regression.py
          python scripts/check_reference_geometry.py artifacts/visual-regression/report.json
      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/quick-v4-gate-once.yml
          git add -A .github/workflows/quick-v4-gate-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time quick v4 gate'
          git push origin HEAD:feat/model-library-reference-v2
