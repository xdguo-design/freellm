name: Batch5 Sync About Page

on:
  push:
    branches:
      - batch5-new-models-20260921

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch5-new-models-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate SEO output
        run: python scripts/build_seo_pages.py
      - name: Commit about page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/index.html
          if git diff --cached --quiet; then
            echo "No about-page change."
          else
            git commit -m "build(models): refresh about model count"
            git push origin HEAD:batch5-new-models-20260921
          fi
