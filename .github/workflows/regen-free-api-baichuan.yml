name: regen-free-api-baichuan
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: python -m pip install pytest
      - name: Validate source
        run: |
          python -m crawler.cli validate data/offers.json
          python - <<'PY'
          import json
          from pathlib import Path
          from crawler.schema import validate_operation_guides, validate_provider_access
          errors=[]
          errors += validate_operation_guides(json.loads(Path("data/operations/baichuan-ai.json").read_text()), "baichuan-ai")
          cards=json.loads(Path("data/provider-access.json").read_text())
          errors += validate_provider_access(next(c for c in cards if c["providerId"]=="baichuan-ai"))
          if errors: raise SystemExit("\n".join(errors))
          PY
      - name: Regenerate
        run: |
          node scripts/generate_ranking.ts
          python scripts/build_static.py
          python scripts/build_seo_pages.py
      - name: Regression
        run: |
          node --test tests/ranking.test.ts
          python -m unittest tests.test_schema tests.test_build_static tests.test_e2e_static -v
          node scripts/generate_ranking.ts --check
          python scripts/build_static.py --check
          python scripts/build_seo_pages.py --check
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No generated changes"; else git commit -m "build: regenerate Baichuan free API artifacts"; git push origin HEAD:dev; fi
