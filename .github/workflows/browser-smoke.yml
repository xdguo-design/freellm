name: browser-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check deployment payload size budget
        run: python scripts/check_deploy_size.py

      - name: Install browser test dependencies
        run: python -m pip install playwright pytest && python -m playwright install --with-deps chromium

      - name: Compile and verify generated output
        run: |
          python -m py_compile scripts/build_static.py scripts/build_seo_pages.py scripts/build_tools_index.py scripts/check_home_performance.py scripts/check_public_home_performance.py
          python scripts/build_tools_index.py --check
          python scripts/build_static.py --check
          python scripts/build_seo_pages.py --check

      - name: Run SEO quality gate unit tests
        run: python -m unittest tests.test_audit_seo_metadata -v

      - name: Run P0 convergence contracts
        run: python -m unittest tests.test_skills_page tests.test_p0_convergence -v

      - name: Run static page browser smoke tests
        run: python -m unittest tests.test_site_visual_system tests.test_e2e_static -v

      - name: Capture Aurora homepage visual review
        if: github.event_name == 'pull_request'
        run: python scripts/capture_aurora_home.py

      - name: Upload Aurora homepage visual review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-home-${{ github.sha }}
          path: artifacts/aurora-home/
          if-no-files-found: error
          retention-days: 7

      - name: Compare homepage performance
        run: python scripts/check_home_performance.py

      - name: Measure production homepage
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/check_public_home_performance.py

      - name: Run model page regression tests
        run: python -m pytest tests/test_model_pages.py -q

      - name: Audit crawl metadata
        run: python scripts/audit_seo_metadata.py
