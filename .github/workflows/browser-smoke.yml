name: browser-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser test dependencies
        run: python -m pip install playwright && python -m playwright install --with-deps chromium

      - name: Run static page browser smoke tests
        run: python -m unittest tests.test_e2e_static -v
