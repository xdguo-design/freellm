name: browser-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check deployment payload size budget
        run: python scripts/check_deploy_size.py

      - name: Install browser test dependencies
        run: python -m pip install playwright pytest && python -m playwright install --with-deps chromium

      - name: Compile and verify generated output
        run: |
          python -m py_compile scripts/build_static.py scripts/build_seo_pages.py scripts/build_tools_index.py scripts/check_home_performance.py scripts/check_public_home_performance.py
          python scripts/build_tools_index.py --check
          python scripts/build_static.py --check
          python scripts/build_seo_pages.py --check

      - name: Run SEO quality gate unit tests
        run: python -m unittest tests.test_audit_seo_metadata -v

      - name: Run P0 convergence contracts
        run: python -m unittest tests.test_skills_page tests.test_p0_convergence -v

      - name: Run static page browser smoke tests
        run: python -m unittest tests.test_site_visual_system tests.test_e2e_static -v

      - name: Capture full-site visual regression
        if: github.event_name == 'pull_request'
        run: python scripts/capture_visual_regression.py

      - name: Upload visual regression artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.sha }}
          path: artifacts/visual-regression/
          if-no-files-found: error
          retention-days: 7

      - name: Compare homepage performance
        run: python scripts/check_home_performance.py

      - name: Measure production homepage
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/check_public_home_performance.py

      - name: Run model page regression tests
        run: python -m pytest tests/test_model_pages.py -q

      - name: Verify MiMo V2.6 catalog, article and live-route contracts
        run: python -m pytest tests/test_mimo_v26.py tests/test_mimo_v26_live_script.py -q

      - name: Install OpenCode CLI for required MiMo live gate
        run: npm install -g opencode-ai@1.18.32

      - name: Run MiMo V2.6 real inference via OpenCode free tier
        run: python scripts/test_mimo_v26_opencode_cli.py

      - name: Run additional credentialed MiMo V2.6 route when available
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
        run: |
          if [ -n "$OPENCODE_API_KEY" ]; then
            python scripts/test_mimo_v26_live.py --provider opencode
          elif [ -n "$PUTER_AUTH_TOKEN" ]; then
            python scripts/test_mimo_v26_live.py --provider puter
          else
            echo "INFO: no additional server-side credential configured; OpenCode CLI live inference above is the required release gate."
          fi

      - name: Persist verified MiMo result, sync main, and regenerate site
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/site-visual-governance'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Merge conflicts:"
            printf '%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -vE '^(design/free-china-ai-index\.html|logs/index\.html)
      - name: Audit crawl metadata
        run: python scripts/audit_seo_metadata.py
 || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            git checkout --ours -- design/free-china-ai-index.html logs/index.html
            git add design/free-china-ai-index.html logs/index.html
          fi

          python scripts/finalize_mimo_v26_verification.py
          node scripts/generate_ranking.ts
          python scripts/build_seo_pages.py --data data/offers.json --output . --site-url https://freellm.top
          python scripts/build_static.py --data data/offers.json --html design/free-china-ai-index.html

          python -m pytest tests/test_mimo_v26.py tests/test_mimo_v26_live_script.py -q
          python -m unittest tests.test_p0_convergence.P0ConvergenceTests.test_home_models_and_logs_share_latest_snapshot -v
          python scripts/check_internal_links.py
          node scripts/generate_ranking.ts --check
          python scripts/build_static.py --check
          python scripts/build_seo_pages.py --check

          git add -A
          if git diff --cached --quiet && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "No finalization changes to commit."
          else
            git commit -m "chore: finalize MiMo verification and sync daily log"
            git push origin HEAD:feat/site-visual-governance
          fi

      - name: Audit crawl metadata
        run: python scripts/audit_seo_metadata.py
