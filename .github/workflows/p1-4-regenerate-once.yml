name: p1-4-regenerate-once
on:
  push:
    branches: [fix/p1-4-english-pages-20261008]
    paths: [.github/workflows/p1-4-regenerate-once.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-4-english-pages-20261008
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate and check all deterministic artifacts
        run: |
          python scripts/build_tools_index.py
          python scripts/build_seo_pages.py --data data/offers.json --output . --site-url https://freellm.top
          python scripts/build_static.py --data data/offers.json --html design/free-china-ai-index.html
          python scripts/build_tools_index.py --check
          python scripts/build_seo_pages.py --check
          python scripts/build_static.py --check
      - name: Commit deterministic artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(P1-4): sync SEO model links after noindex fix'
            git push origin HEAD:fix/p1-4-english-pages-20261008
          fi
