name: release-log-sync-temporary
on:
  push:
    branches: [release/2026-10-09-home-ux-safe]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate all in workspace from canonical daily log
        run: python scripts/build_seo_pages.py --data data/offers.json --output . --site-url https://freellm.top
      - name: Save only public /logs HTML
        run: |
          git add logs/index.html
          if git diff --cached --quiet; then
            echo "Public logs already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(release): rebuild merged Oct-09 update dashboard"
          git push origin HEAD:release/2026-10-09-home-ux-safe
