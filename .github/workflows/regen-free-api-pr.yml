name: regen-free-api-pr

on:
  push:
    branches:
      - update/free-api-news-20260929

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/free-api-news-20260929
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Validate source schema
        run: |
          python -m crawler.cli validate data/offers.json
          python - <<'PY'
          import json
          from pathlib import Path
          from crawler.schema import validate_operation_guides, validate_provider_access, validate_model_access

          operation = json.loads(Path("data/operations/tencent-tokenhub.json").read_text(encoding="utf-8"))
          provider_cards = json.loads(Path("data/provider-access.json").read_text(encoding="utf-8"))
          model_cards = json.loads(Path("data/model-access.json").read_text(encoding="utf-8"))

          tokenhub = next(card for card in provider_cards if card.get("providerId") == "tencent-tokenhub")
          xing = next(card for card in model_cards if card.get("modelId") == "siliconflow/xing4-0-29b")

          errors = []
          errors += validate_operation_guides(operation, "TokenHub operation")
          errors += validate_provider_access(tokenhub)
          errors += validate_model_access(xing)
          if errors:
              raise SystemExit("\n".join(errors))
          print("TokenHub operation/access and Xing4.0 access cards valid")
          PY

      - name: Regenerate derived artifacts
        run: |
          node scripts/generate_ranking.ts
          python scripts/build_static.py
          python scripts/build_seo_pages.py

      - name: Run focused regression tests
        run: |
          node --test tests/ranking.test.ts
          python -m unittest tests.test_schema tests.test_build_static tests.test_e2e_static -v

      - name: Verify generated artifacts
        run: |
          node scripts/generate_ranking.ts --check
          python scripts/build_static.py --check
          python scripts/build_seo_pages.py --check
          python scripts/site_health.py --report site-health-report.json

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: regenerate free AI artifacts"
            git push origin HEAD:update/free-api-news-20260929
          fi
