name: regen-free-api-pr

on:
  push:
    branches:
      - update/free-api-news-20260929

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/free-api-news-20260929
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate source data
        run: |
          python -m crawler.cli validate data/offers.json
          python -m unittest discover -s tests -v
          node --test tests/ranking.test.ts

      - name: Regenerate derived artifacts
        run: |
          node scripts/generate_ranking.ts
          python scripts/build_static.py
          python scripts/build_seo_pages.py

      - name: Verify generated artifacts
        run: |
          node scripts/generate_ranking.ts --check
          python scripts/build_static.py --check
          python scripts/build_seo_pages.py --check
          python scripts/site_health.py --report site-health-report.json

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: regenerate free AI artifacts"
            git push origin HEAD:update/free-api-news-20260929
          fi
