name: refresh-generated-artifacts

on:
  push:
    branches:
      - feat/site-visual-governance
    paths:
      - "data/offers.json"
      - "data/models.json"
      - "data/models-curated.json"
      - "data/ranked-offers.json"
      - "scripts/build_static.py"
      - "scripts/build_seo_pages.py"
      - ".github/workflows/refresh-generated-artifacts.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-visual-governance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate deterministic ranking
        run: node scripts/generate_ranking.ts

      - name: Regenerate homepage and SEO/model pages
        run: |
          python scripts/build_static.py
          python scripts/build_seo_pages.py

      - name: Validate generated artifacts
        run: |
          node scripts/generate_ranking.ts --check
          python scripts/build_static.py --check
          python scripts/build_seo_pages.py --check
          python -m unittest tests.test_mimo_v26 -v
          python -m pytest tests/test_model_catalog.py tests/test_model_pages.py -q

      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "freellm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "build: refresh generated artifacts for MiMo V2.6"
          git push origin HEAD:feat/site-visual-governance
