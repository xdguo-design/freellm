name: skills-zh-translation-build

on:
  push:
    branches:
      - ui/skills-zh-translation

permissions:
  contents: write

concurrency:
  group: skills-zh-translation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/skills-zh-translation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tests
        run: python -m pip install pytest
      - name: Compile generators
        run: python -m py_compile scripts/build_seo_pages.py scripts/build_verified_skill_catalog.py
      - name: Regenerate skills catalog and pages
        run: |
          python scripts/build_verified_skill_catalog.py
          python scripts/build_seo_pages.py
      - name: Verify Skills localization
        run: |
          python -m unittest tests.test_skills_page -v
          python - <<'PY'
          from pathlib import Path
          page = Path("skills/index.html").read_text(encoding="utf-8")
          assert "SKILL 中文说明" in page
          assert "查看完整 SKILL.md 原文" in page
          assert "查看英文原文" in page
          assert "Skills 设计的核心简洁性" in page
          assert 'review.quote_zh' in page
          PY
          python scripts/check_internal_links.py
          python scripts/audit_seo_metadata.py
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated output already current"
          else
            git commit -m "build(skills): publish Chinese translation layer"
            git push origin HEAD:ui/skills-zh-translation
          fi
