name: capture-v4-geometry-once

on:
  push:
    branches:
      - feat/model-library-reference-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-library-reference-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Capture geometry
        run: |
          python scripts/capture_visual_regression.py
          echo '---V4_GEOMETRY_REPORT---'
          cat artifacts/visual-regression/report.json
      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/capture-v4-geometry-once.yml
          git add -A .github/workflows/capture-v4-geometry-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time v4 geometry capture'
          git push origin HEAD:feat/model-library-reference-v2
