name: refresh-generated-artifacts-temp

on:
  push:
    branches:
      - feat/site-visual-governance
    paths:
      - "data/offers.json"
      - "data/models.json"
      - "data/models-curated.json"
      - "data/model-access.json"
      - "data/provider-access.json"
      - "tests/test_mimo_v26.py"
      - "docs/wechat/mimo-v2-6-flash.html"
      - ".github/workflows/refresh-generated-artifacts-temp.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-visual-governance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install pytest

      - name: Generate ranking and static outputs
        run: |
          node scripts/generate_ranking.ts
          python scripts/build_static.py
          python scripts/build_seo_pages.py

      - name: Validate outputs and MiMo contracts
        run: |
          node scripts/generate_ranking.ts --check
          python scripts/build_static.py --check
          python scripts/build_seo_pages.py --check
          python -m pytest tests/test_mimo_v26.py tests/test_model_catalog.py tests/test_model_pages.py -q

      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "freellm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "build: refresh artifacts for Puter MiMo V2.6 route"
          git push origin HEAD:feat/site-visual-governance
