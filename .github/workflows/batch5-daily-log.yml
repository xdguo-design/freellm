name: Batch5 Build Daily Log

on:
  push:
    branches:
      - batch5-new-models-20260921

permissions:
  contents: write

jobs:
  log:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch5-new-models-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build 2026-09-21 log snapshot
        run: |
          python -m crawler.cli log             --models data/models.json             --offers data/offers.json             --previous data/daily-log/2026-09-20.json             --out data/daily-log/2026-09-21.json             --as-of 2026-09-21             --merge             --models-status ok             --offers-status ok
          python scripts/build_seo_pages.py
          python scripts/build_static.py
      - name: Commit daily log output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-log/2026-09-21.json logs design/free-china-ai-index.html feed.xml sitemap*.xml .seo-pages-manifest.json
          if git diff --cached --quiet; then
            echo "No daily-log changes."
          else
            git commit -m "chore(log): record 2026-09-21 model additions"
            git push origin HEAD:batch5-new-models-20260921
          fi
