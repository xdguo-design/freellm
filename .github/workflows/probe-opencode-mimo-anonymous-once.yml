name: probe-opencode-mimo-anonymous-once
on:
  push:
    branches: ["feat/site-visual-governance"]
    paths: [".github/opencode-anon-probe"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-visual-governance
      - name: Probe anonymous MiMo free endpoint
        run: |
          set +e
          code=$(curl -sS -o /tmp/mimo-response.json -w "%{http_code}" \
            https://opencode.ai/zen/v1/chat/completions \
            -H 'Content-Type: application/json' \
            --data '{"model":"mimo-v2.6-flash-free","messages":[{"role":"user","content":"Reply with exactly: MiMo OK"}],"max_tokens":16}')
          echo "HTTP_STATUS=$code"
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/mimo-response.json').read_text(encoding='utf-8', errors='replace')
          print(text[:2000])
          PY
          if [ "$code" = "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/mimo-response.json').read_text())
          text=((data.get('choices') or [{}])[0].get('message') or {}).get('content') or ''
          if not text.strip(): raise SystemExit('HTTP 200 but no assistant content')
          print('MIMO_ANON_REAL_OUTPUT=' + text[:240].replace('\n',' '))
          PY
          fi
      - name: Remove one-shot probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/opencode-anon-probe .github/workflows/probe-opencode-mimo-anonymous-once.yml
          git commit -m "chore: remove one-shot MiMo anonymous probe"
          git push origin HEAD:feat/site-visual-governance
