name: one-shot-aurora-model-center-sync

on:
  push:
    branches:
      - feat/aurora-phase1-home
    paths:
      - ".github/workflows/one-shot-aurora-model-center-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aurora-phase1-home
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate SEO outputs
        run: python scripts/build_seo_pages.py
      - name: Commit only model-center generated output
        run: |
          if git diff --quiet -- models/center/index.html; then
            echo "No model-center changes"
            exit 0
          fi
          git config user.name "freellm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add models/center/index.html
          git commit -m "build: sync model center after homepage phase isolation"
          git push origin HEAD:feat/aurora-phase1-home
