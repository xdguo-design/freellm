name: offer-test-policy-build

on:
  push:
    branches:
      - policy/offer-freellm-tests

permissions:
  contents: write

concurrency:
  group: offer-test-policy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: policy/offer-freellm-tests
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile changed generators
        run: |
          python -m py_compile crawler/schema.py
          python -m py_compile scripts/build_seo_pages.py
      - name: Rebuild site
        run: |
          python scripts/build_static.py
          python scripts/build_seo_pages.py
      - name: Run offer-test policy regression
        run: |
          python -m pytest tests/test_offer_freellm_tests.py -q
          python -m unittest tests.test_e2e_static -v
          python -m pytest tests/test_model_pages.py -q
          python scripts/check_internal_links.py
          python scripts/audit_seo_metadata.py
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated output already current"
          else
            git commit -m "build: publish FreeLLM offer-test explanations"
            git push origin HEAD:policy/offer-freellm-tests
          fi
