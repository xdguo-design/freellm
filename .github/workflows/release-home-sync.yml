name: release-home-sync-temporary
on:
  push:
    branches:
      - release/2026-10-09-home-ux-safe
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild homepage from canonical offers and daily log
        run: python scripts/build_static.py --data data/offers.json --html design/free-china-ai-index.html
      - name: Persist only generated homepage artifacts
        run: |
          git add design/free-china-ai-index.html data/offers.js data/offers-ranked.json
          if git diff --cached --quiet; then
            echo "Generated homepage already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(release): regenerate canonical homepage output"
          git push origin HEAD:release/2026-10-09-home-ux-safe
