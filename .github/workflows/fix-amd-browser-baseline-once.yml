name: fix-amd-browser-baseline-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-amd-browser-baseline-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update AMD browser baselines
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_e2e_static.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '        self.assertRegex(log, rf"<strong>{models} <span")',
                  '        self.assertIn(f\'<strong>{models}</strong><small><span lang="zh-CN">当前观测到的模型记录</span>\', log)',
                  "daily log live snapshot assertion",
              ),
              (
                  'self.assertEqual(page.locator(".filter-strip [data-filter=\'free_quota\'] em").inner_text(), "19")',
                  'self.assertEqual(page.locator(".filter-strip [data-filter=\'free_quota\'] em").inner_text(), "20")',
                  "free quota filter count",
              ),
              (
                  'self.assertEqual(page.locator(".category-card[data-filter=\'free_quota\'] [data-category-count]").inner_text(), "19")',
                  'self.assertEqual(page.locator(".category-card[data-filter=\'free_quota\'] [data-category-count]").inner_text(), "20")',
                  "free quota category count",
              ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f"{label} not found")
              text = text.replace(old, new, 1)

          marker = '        page.fill("#catalog-search", "Qwen3")'
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Qwen3 search marker not found")
          old = '        self.assertEqual(self.visible_offers(page), 2)'
          pos = text.find(old, start, start + 500)
          if pos < 0:
              raise SystemExit("Qwen3 result assertion not found")
          new = '        self.assertEqual(self.visible_offers(page), 3)'
          text = text[:pos] + new + text[pos + len(old):]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Run static contract regression
        run: python -m unittest tests.test_e2e_static.StaticContractTests.test_daily_log_dashboard_exposes_baseline_snapshot

      - name: Commit test baseline fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_e2e_static.py
          git commit -m "test: update catalog baselines for AMD Radeon Cloud"
          git push origin HEAD:main
