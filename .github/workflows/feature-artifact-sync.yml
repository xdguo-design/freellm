name: feature-artifact-sync

on:
  push:
    branches:
      - fix/p0-data-trust-20261008
    paths:
      - .github/workflows/feature-artifact-sync.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-data-trust-20261008
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate deterministic homepage artifacts on feature branch
        run: |
          python scripts/build_static.py --data data/offers.json --html design/free-china-ai-index.html
          python scripts/build_static.py --check
      - name: Commit regenerated outputs to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/free-china-ai-index.html data/offers.js data/offers-ranked.json js/homepage.*.js js/homepage-i18n.*.js css/homepage.*.css css/homepage-editorial.*.css
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          git commit -m "chore(P0-1): synchronize generated homepage artifacts"
          git push origin HEAD:fix/p0-data-trust-20261008
