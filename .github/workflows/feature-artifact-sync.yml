name: feature-artifact-sync

on:
  push:
    branches: [fix/p0-data-trust-20261008]
    paths:
      - .github/workflows/feature-artifact-sync.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-data-trust-20261008
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh ranking and static homepage artifacts
        run: |
          node scripts/generate_ranking.ts
          python scripts/build_static.py --data data/offers.json --html design/free-china-ai-index.html
          node scripts/generate_ranking.ts --check
          python scripts/build_static.py --check
      - name: Commit artifacts on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/ranked-offers.json data/offers-ranked.json data/offers.js design/free-china-ai-index.html js/homepage.*.js js/homepage-i18n.*.js css/homepage.*.css css/homepage-editorial.*.css
          if git diff --cached --quiet; then
            echo "Artifacts already current."
            exit 0
          fi
          git commit -m "chore(P0-1): sync validated catalog and ranking artifacts"
          git push origin HEAD:fix/p0-data-trust-20261008
