name: p0-convergence-build

on:
  push:
    branches:
      - p0/site-convergence
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: p0-convergence-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/site-convergence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Compile generators
        run: |
          python -m py_compile scripts/build_static.py
          python -m py_compile scripts/build_seo_pages.py
          python -m py_compile scripts/build_tools_index.py

      - name: Rebuild static output
        run: |
          python scripts/build_tools_index.py
          python scripts/build_static.py
          python scripts/build_seo_pages.py

      - name: Run P0 data and page regressions
        run: |
          python -m unittest tests.test_skills_page tests.test_p0_convergence -v
          python -m pytest tests/test_model_pages.py -q
          python scripts/check_internal_links.py
          python scripts/audit_seo_metadata.py

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated output already current"
          else
            git commit -m "build(p0): refresh converged static output"
            git push origin HEAD:p0/site-convergence
          fi
