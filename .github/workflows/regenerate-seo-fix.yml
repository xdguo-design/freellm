name: regenerate-seo-fix

on:
  push:
    branches:
      - fix/seo-audit-warnings
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, 'chore: regenerate SEO output')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-audit-warnings
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate crawl-facing static pages
        run: |
          python scripts/build_seo_pages.py
          python scripts/build_static.py

      - name: Audit regenerated output
        continue-on-error: true
        run: python scripts/audit_seo_metadata.py

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .seo-pages-manifest.json sitemap*.xml feed.xml design/free-china-ai-index.html offers category guides models providers logs skills
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: regenerate SEO output"
          git push origin HEAD:fix/seo-audit-warnings
