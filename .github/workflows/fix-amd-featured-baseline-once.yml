name: fix-amd-featured-baseline-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-amd-featured-baseline-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update free quota shortcut baselines
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_e2e_static.py")
          text = path.read_text(encoding="utf-8")
          old = "        self.assertEqual(self.visible_offers(page), 19)"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly 2 remaining free-quota baselines, found {count}")
          text = text.replace(old, "        self.assertEqual(self.visible_offers(page), 20)")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit test baseline fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_e2e_static.py
          git commit -m "test: update free quota shortcut baseline for AMD"
          git push origin HEAD:main
