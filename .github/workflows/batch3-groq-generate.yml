name: Batch3 Generate Groq Pages

on:
  push:
    branches:
      - batch3-groq-retirements-20260921

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch3-groq-retirements-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate offer and SEO output
        run: |
          python scripts/build_static.py
          python scripts/build_seo_pages.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design offers category guides logs models providers skills sitemap*.xml .seo-pages-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build(groq): refresh generated pages"
            git push origin HEAD:batch3-groq-retirements-20260921
          fi
