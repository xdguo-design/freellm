<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 281" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset=".55" stop-color="#f0f8ff"/>
      <stop offset="1" stop-color="#e0efff"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc4ff"/>
      <stop offset="1" stop-color="#5ea4f6"/>
    </linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ef0"/>
      <stop offset="1" stop-color="#6ea8f8"/>
    </linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5d8ff"/>
      <stop offset="1" stop-color="#8fc0f7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#eff7ff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4a90e2" flood-opacity=".22"/>
    </filter>
    <filter id="tiny" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4a90e2" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="900" height="281" fill="url(#sky)"/>
  <circle cx="640" cy="70" r="100" fill="#ffffff" opacity=".45"/>
  <circle cx="240" cy="210" r="90" fill="#ffffff" opacity=".3"/>
  <ellipse cx="560" cy="160" rx="230" ry="70" fill="none" stroke="#9cc4f2" stroke-width="1.5" stroke-dasharray="7 9" opacity=".55"/>

  <g fill="#8fc0f5">
    <path d="M180 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M820 190l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" opacity=".8"/>
    <circle cx="380" cy="36" r="3.6" opacity=".6"/>
    <circle cx="700" cy="250" r="3.2" opacity=".5"/>
  </g>

  <!-- cube robot (matches models hero family) -->
  <g filter="url(#soft)">
    <!-- antenna -->
    <path d="M560 52c0-10 8-18 18-18" fill="none" stroke="#7fa8e0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="578" cy="34" r="9" fill="#ff8a5c"/>
    <!-- left ear disc -->
    <ellipse cx="484" cy="140" rx="16" ry="34" fill="url(#sideL)"/>
    <!-- right ear disc -->
    <ellipse cx="636" cy="140" rx="16" ry="34" fill="url(#sideR)"/>
    <!-- head cube: front + top + right -->
    <polygon points="500,86 560,54 620,86 560,118" fill="url(#face)" opacity=".95"/>
    <polygon points="500,86 560,118 560,206 500,172" fill="url(#sideL)"/>
    <polygon points="560,118 620,86 620,172 560,206" fill="url(#sideR)"/>
    <!-- face screen -->
    <rect x="512" y="104" width="96" height="64" rx="12" fill="#10314f"/>
    <g fill="#7ef0c0">
      <rect x="528" y="122" width="12" height="16" rx="3"/>
      <rect x="548" y="122" width="12" height="16" rx="3"/>
      <rect x="568" y="122" width="12" height="16" rx="3"/>
      <rect x="588" y="122" width="12" height="16" rx="3"/>
      <rect x="528" y="146" width="24" height="6" rx="3" opacity=".7"/>
      <rect x="560" y="146" width="40" height="6" rx="3" opacity=".5"/>
    </g>
    <ellipse cx="560" cy="222" rx="110" ry="14" fill="#4a90e2" opacity=".12"/>
  </g>

  <!-- floating skill cards -->
  <g filter="url(#tiny)">
    <g transform="translate(688,60) rotate(6)">
      <rect width="150" height="66" rx="13" fill="url(#glass)" stroke="#cfe2f7" stroke-width="1.6"/>
      <circle cx="28" cy="33" r="14" fill="#e4f3ff"/>
      <circle cx="24" cy="30" r="5" fill="none" stroke="#127dfd" stroke-width="2"/>
      <path d="M28 34l6 6" stroke="#127dfd" stroke-width="2.4" stroke-linecap="round"/>
      <text x="50" y="29" font-size="13" font-weight="700" fill="#17325c">SKILL.md</text>
      <text x="50" y="47" font-size="10" fill="#5f7ba3">原文核验收录</text>
    </g>
  </g>
  <g filter="url(#tiny)">
    <g transform="translate(712,166) rotate(-5)">
      <rect width="150" height="66" rx="13" fill="url(#glass)" stroke="#cfe2f7" stroke-width="1.6"/>
      <rect x="15" y="15" width="26" height="26" rx="7" fill="#e4f3ff"/>
      <rect x="20" y="20" width="10" height="8" fill="#17ad6c"/>
      <circle cx="33" cy="29" r="4" fill="none" stroke="#17ad6c" stroke-width="2"/>
      <text x="50" y="29" font-size="13" font-weight="700" fill="#17325c">数据分析</text>
      <text x="50" y="47" font-size="10" fill="#5f7ba3">开箱即用配方</text>
    </g>
  </g>
  <g filter="url(#tiny)">
    <g transform="translate(330,30) rotate(-6)">
      <rect width="140" height="62" rx="13" fill="url(#glass)" stroke="#cfe2f7" stroke-width="1.6"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#e4f3ff"/>
      <path d="M18 32l6-9 5 6 7-10" fill="none" stroke="#f0925c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="27" font-size="12.5" font-weight="700" fill="#17325c">社区共创</text>
      <text x="48" y="44" font-size="10" fill="#5f7ba3">真实测试记录</text>
    </g>
  </g>
  <g filter="url(#tiny)" opacity=".92">
    <g transform="translate(300,196) rotate(4)">
      <rect width="132" height="58" rx="12" fill="url(#glass)" stroke="#cfe2f7" stroke-width="1.6"/>
      <text x="14" y="26" font-size="14" font-weight="800" fill="#127dfd">+ 每周</text>
      <text x="14" y="44" font-size="10" fill="#5f7ba3">新增收录技能</text>
      <g stroke="#bcd5f3" stroke-width="2"><path d="M72 18h44M72 28h36M72 38h40"/></g>
    </g>
  </g>

  <text x="180" y="120" transform="rotate(-4 180 120)" font-family="'Segoe Script','KaiTi','STKaiti',cursive" font-size="20" font-weight="600" fill="#4d7ec5">Skills Make AI Useful</text>
  <path d="M184 130c30 9 66 11 102 6" fill="none" stroke="#8cc6f5" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>
