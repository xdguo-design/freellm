<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset=".5" stop-color="#f1f5ff"/>
      <stop offset="1" stop-color="#e3ecff"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ea8ff"/>
      <stop offset="1" stop-color="#5f7ef4"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d63e8"/>
      <stop offset="1" stop-color="#6d85f6"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab9ff"/>
      <stop offset="1" stop-color="#8ea4fb"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f0f3ff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5b6fe8" flood-opacity=".24"/>
    </filter>
    <filter id="tiny" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5b6fe8" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="900" height="420" fill="url(#sky)"/>
  <circle cx="640" cy="120" r="130" fill="#ffffff" opacity=".4"/>
  <circle cx="250" cy="300" r="110" fill="#ffffff" opacity=".28"/>

  <ellipse cx="560" cy="240" rx="268" ry="92" fill="none" stroke="#9aa9ee" stroke-width="1.6" stroke-dasharray="7 9" opacity=".55"/>

  <g fill="#8f9ff0">
    <path d="M150 108l3.4 8.8 8.8 3.4-8.8 3.4-3.4 8.8-3.4-8.8-8.8-3.4 8.8-3.4z"/>
    <path d="M792 306l2.6 6.8 6.8 2.6-6.8 2.6-2.6 6.8-2.6-6.8-6.8-2.6 6.8-2.6z" opacity=".8"/>
    <path d="M404 64l2.2 5.6 5.6 2.2-5.6 2.2-2.2 5.6-2.2-5.6-5.6-2.2 5.6-2.2z" opacity=".6"/>
    <circle cx="722" cy="66" r="4" opacity=".55"/>
    <circle cx="310" cy="360" r="3.6" opacity=".5"/>
  </g>

  <!-- isometric AI cube -->
  <g filter="url(#soft)">
    <polygon points="560,150 700,84 840,152 700,218" fill="url(#top)"/>
    <polygon points="560,150 700,218 700,330 560,262" fill="url(#left)"/>
    <polygon points="700,218 840,152 840,262 700,330" fill="url(#right)"/>
    <polygon points="560,150 700,84 840,152 700,218" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/>
    <g transform="translate(636,116)">
      <rect width="128" height="56" rx="12" fill="#ffffff" opacity=".94"/>
      <text x="64" y="38" text-anchor="middle" font-size="26" font-weight="900" fill="#4d63e8" letter-spacing="2">AI</text>
    </g>
    <ellipse cx="700" cy="332" rx="130" ry="18" fill="#5b6fe8" opacity=".12"/>
  </g>

  <!-- connector lines -->
  <g stroke="#8f9ff0" stroke-width="3" fill="none" stroke-dasharray="8 8" opacity=".75">
    <path d="M470 190c40-14 60-24 88-36"/>
    <path d="M588 268c-30-4-56-12-84-26"/>
    <path d="M716 330c6-30 10-56 14-84"/>
  </g>
  <g fill="#8f9ff0">
    <circle cx="470" cy="190" r="6"/>
    <circle cx="588" cy="268" r="6"/>
    <circle cx="730" cy="246" r="6"/>
  </g>

  <!-- glass node cards -->
  <g filter="url(#tiny)">
    <g transform="translate(296,128) rotate(-7)">
      <rect width="176" height="74" rx="14" fill="url(#glass)" stroke="#c9d3f8" stroke-width="1.6"/>
      <circle cx="30" cy="37" r="15" fill="#eef1ff"/>
      <path d="M24 37a6 6 0 1 1 12 0 6 6 0 0 1-12 0m4-8.4a11 11 0 0 0 0 16.8m9.4-18.6a14 14 0 0 1 0 20.4" fill="none" stroke="#5f7ef4" stroke-width="2" stroke-linecap="round"/>
      <text x="54" y="33" font-size="14" font-weight="700" fill="#2b3a86">更新检查</text>
      <text x="54" y="52" font-size="10.5" fill="#6d7bb5">每天核对官方来源</text>
    </g>
  </g>
  <g filter="url(#tiny)">
    <g transform="translate(432,246) rotate(4)">
      <rect width="164" height="74" rx="14" fill="url(#glass)" stroke="#c9d3f8" stroke-width="1.6"/>
      <circle cx="30" cy="37" r="15" fill="#eef1ff"/>
      <path d="M22 40l6-8 5 6 9-11" fill="none" stroke="#17ad6c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="33" font-size="14" font-weight="700" fill="#2b3a86">可复用</text>
      <text x="54" y="52" font-size="10.5" fill="#6d7bb5">一套流程反复执行</text>
    </g>
  </g>
  <g filter="url(#tiny)">
    <g transform="translate(676,306) rotate(-4)">
      <rect width="164" height="74" rx="14" fill="url(#glass)" stroke="#c9d3f8" stroke-width="1.6"/>
      <circle cx="30" cy="37" r="15" fill="#eef1ff"/>
      <g stroke="#e8834e" stroke-width="2.2" fill="none" stroke-linecap="round">
        <circle cx="30" cy="37" r="6.5"/>
        <path d="M24.5 29l-3.5-4M35.5 29l3.5-4M24.5 45l-3.5 4M35.5 45l3.5 4"/>
      </g>
      <text x="54" y="33" font-size="14" font-weight="700" fill="#2b3a86">链接一切</text>
      <text x="54" y="52" font-size="10.5" fill="#6d7bb5">模型 · 工具 · Skills</text>
    </g>
  </g>
  <g filter="url(#tiny)" opacity=".9">
    <g transform="translate(96,236) rotate(6)">
      <rect width="150" height="64" rx="13" fill="url(#glass)" stroke="#c9d3f8" stroke-width="1.6"/>
      <rect x="16" y="18" width="28" height="28" rx="8" fill="#eef1ff"/>
      <g stroke="#5f7ef4" stroke-width="2.2" fill="none" stroke-linecap="round">
        <path d="M23 32h14M30 25v14"/>
      </g>
      <text x="54" y="30" font-size="13" font-weight="700" fill="#2b3a86">06 套</text>
      <text x="54" y="47" font-size="10" fill="#6d7bb5">人工编排工作流</text>
    </g>
  </g>

  <text x="330" y="60" transform="rotate(-3 330 60)" font-family="'Segoe Script','KaiTi','STKaiti',cursive" font-size="23" font-weight="600" fill="#5d6fd6">Workflows Make Ideas Happen</text>
  <path d="M336 70c88 14 200 16 288 6" fill="none" stroke="#a9b5f2" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>
