<polygon points="574,105 640,138 640,222 574,189" fill="url(#mhLeft)" stroke="#ffffff" stroke-width="2"/>
<polygon points="706,105 640,138 640,222 706,189" fill="url(#mhRight)" stroke="#ffffff" stroke-width="2"/>
<text x="640" y="196" text-anchor="middle" font-family="Arial, 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1" transform="rotate(-4 640 180)">AI</text>
<polygon points="640,72 706,105 640,138 574,105" fill="#ffffff" opacity=".25"/>
</g>

