<ellipse cx="512" cy="292" rx="212" ry="46" fill="#a5c8f2" opacity=".45"/>
<ellipse cx="512" cy="283" rx="212" ry="46" fill="url(#mhPlat)" opacity=".92" stroke="#ffffff" stroke-width="1.6" stroke-opacity=".8"/>
