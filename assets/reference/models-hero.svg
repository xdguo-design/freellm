<g opacity=".65"><polygon points="60,300 78,309 60,318 42,309" fill="url(#mhTop)"/><polygon points="42,309 60,318 60,336 42,327" fill="url(#mhLeft)" opacity=".6"/><polygon points="78,309 60,318 60,336 78,327" fill="url(#mhRight)" opacity=".65"/></g>
<g opacity=".7"><polygon points="420,180 436,188 420,196 404,188" fill="url(#mhTop)"/><polygon points="404,188 420,196 420,214 404,206" fill="url(#mhLeft)" opacity=".6"/><polygon points="436,188 420,196 420,214 436,206" fill="url(#mhRight)" opacity=".65"/></g>
</g>

