<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1063 350" fill="none">
<defs>
<radialGradient id="mhGlow" cx=".5" cy=".5" r=".5"><stop stop-color="#bcd9ff" stop-opacity=".85"/><stop offset=".55" stop-color="#d8e9ff" stop-opacity=".38"/><stop offset="1" stop-color="#eaf4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="mhGlow2" cx=".5" cy=".5" r=".5"><stop stop-color="#e5f1ff" stop-opacity=".9"/><stop offset="1" stop-color="#e5f1ff" stop-opacity="0"/></radialGradient>
<linearGradient id="mhTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#cfe4ff"/></linearGradient>
<linearGradient id="mhLeft" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8fbcff"/><stop offset="1" stop-color="#3b7bf0"/></linearGradient>
<linearGradient id="mhRight" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2f6ceb"/><stop offset="1" stop-color="#9cc6ff"/></linearGradient>
<linearGradient id="mhPlat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dbe9fd"/><stop offset="1" stop-color="#b7d4f8"/></linearGradient>
<linearGradient id="mhGlass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".92"/><stop offset="1" stop-color="#d3e7ff" stop-opacity=".65"/></linearGradient>
<filter id="mhSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="mhBlur2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<!-- ambient glows -->
<circle cx="660" cy="140" r="240" fill="url(#mhGlow)"/>
<circle cx="980" cy="230" r="180" fill="url(#mhGlow2)"/>
<circle cx="250" cy="90" r="150" fill="url(#mhGlow2)"/>
<ellipse cx="512" cy="320" rx="300" ry="46" fill="#c9defa" opacity=".55" filter="url(#mhBlur2)"/>
