<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfefe"/>
      <stop offset=".6" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#dbeefc"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe6fa"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4fe"/>
      <stop offset="1" stop-color="#a8d0f2"/>
    </linearGradient>
    <radialGradient id="orb" cx=".38" cy=".32" r=".9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#bfe2ff"/>
      <stop offset="1" stop-color="#6fb2f2"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#eff7ff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4a90e2" flood-opacity=".2"/>
    </filter>
    <filter id="tiny" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#4a90e2" flood-opacity=".22"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="420" fill="url(#sky)"/>
  <circle cx="660" cy="104" r="130" fill="#ffffff" opacity=".5"/>

  <!-- sun halo -->
  <circle cx="676" cy="118" r="58" fill="#fff3d6" opacity=".8" filter="url(#glow)"/>

  <!-- mountains -->
  <path d="M0 420l180-190 88 76 108-142 128 156 96-84 150 106 150-70v148z" fill="url(#m2)" opacity=".55"/>
  <path d="M0 420l150-158 96 82 112-130 132 150 118-96 292 152z" fill="url(#m1)"/>
  <!-- snow caps -->
  <path d="M150 262l46-48 34 29-24 8 6 16-30-6-4 18-28-17z" fill="#ffffff"/>
  <path d="M358 232l50-58 38 32-26 9 8 17-33-7-5 19-32-12z" fill="#ffffff"/>
  <path d="M578 268l40-34 30 24-22 6 6 13-26-4-4 13-24-18z" fill="#ffffff"/>

  <!-- person on mid peak holding glowing orb -->
  <g filter="url(#tiny)">
    <circle cx="500" cy="252" r="9" fill="#1d4f88"/>
    <rect x="492" y="260" width="16" height="34" rx="7" fill="#1d4f88"/>
    <path d="M494 268l-16 26M506 268l18-6" stroke="#1d4f88" stroke-width="7" stroke-linecap="round"/>
    <circle cx="530" cy="258" r="14" fill="url(#orb)"/>
    <circle cx="530" cy="258" r="14" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".9"/>
    <path d="M524 252a9 9 0 0 1 10-2" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- small flag on far peak -->
  <g opacity=".85">
    <path d="M258 176v-30" stroke="#7fa2c9" stroke-width="4" stroke-linecap="round"/>
    <path d="M258 148l26 8-26 9z" fill="#ff8a5c"/>
  </g>

  <!-- floating glass labels -->
  <g filter="url(#tiny)">
    <g transform="translate(560,84) rotate(6)">
      <rect width="150" height="62" rx="13" fill="url(#glass)" stroke="#cfe2f7" stroke-width="1.6"/>
      <circle cx="27" cy="31" r="13" fill="#e4f3ff"/>
      <path d="M20 34l7-9 5 6 8-10" fill="none" stroke="#127dfd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="27" font-size="13" font-weight="700" fill="#17325c">被看见</text>
      <text x="48" y="45" font-size="10" fill="#5f7ba3">优质资源不埋没</text>
    </g>
  </g>
  <g filter="url(#tiny)">
    <g transform="translate(536,168) rotate(-6)">
      <rect width="150" height="62" rx="13" fill="url(#glass)" stroke="#cfe2f7" stroke-width="1.6"/>
      <circle cx="27" cy="31" r="13" fill="#e4f3ff"/>
      <path d="M27 22v18M19 30l8-8 8 8" stroke="#17ad6c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="47" y="26" font-size="13" font-weight="700" fill="#17325c">低门槛</text>
      <text x="47" y="44" font-size="10" fill="#5f7ba3">人人都能上手</text>
    </g>
  </g>
  <g filter="url(#tiny)">
    <g transform="translate(388,100) rotate(-5)">
      <rect width="146" height="60" rx="13" fill="url(#glass)" stroke="#cfe2f7" stroke-width="1.6"/>
      <circle cx="26" cy="30" r="13" fill="#e4f3ff"/>
      <path d="M26 22a8 8 0 1 1-8 9" fill="none" stroke="#f0925c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M26 22l3-4M26 22l4 2" stroke="#f0925c" stroke-width="2.4" stroke-linecap="round"/>
      <text x="47" y="26" font-size="13" font-weight="700" fill="#17325c">先核验</text>
      <text x="47" y="44" font-size="10" fill="#5f7ba3">再收录与推荐</text>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#8fc0f5">
    <path d="M120 130l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".7"/>
    <path d="M812 300l2.6 6.8 6.8 2.6-6.8 2.6-2.6 6.8-2.6-6.8-6.8-2.6 6.8-2.6z" opacity=".7"/>
    <circle cx="300" cy="300" r="3.6" opacity=".55"/>
  </g>

  <text x="96" y="212" transform="rotate(-4 96 212)" font-family="'Segoe Script','KaiTi','STKaiti',cursive" font-size="22" font-weight="600" fill="#4d7ec5">Better AI, A Brighter Tomorrow</text>
  <path d="M100 222c48 12 108 14 156 8" fill="none" stroke="#8cc6f5" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>
