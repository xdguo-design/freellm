<title>闰年计算 · FreeLLM</title>

</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/tools/js/lib-crypto.js"></script>
<script src="/tools/js/lib-format.js"></script>
<script src="/tools/js/lib-utils.js"></script>

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('闰年计算', '公历闰年判断 + 范围内所有闰年列表', 'leap-year');
var year = T.num(2028, { min: 1, max: 9999, style: 'width:110px' });
var box = T.el('div');
function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function run() {
  var y = +year.value;
  T.clearEl(box);
  if (!y) return;
  var leap = isLeap(y);
  var next = y + 1;
  while (!isLeap(next)) next++;
  var prev = y - 1;
  while (prev > 0 && !isLeap(prev)) prev--;
  box.appendChild(T.kvTable([
    [y + ' 年', leap ? '✓ 闰年（366 天，2 月有 29 天）' : '✗ 平年（365 天）'],
    ['判断规则', (y % 4 === 0 ? '✓ 能被 4 整除' : '✗ 不能被 4 整除') + (y % 100 === 0 ? ' · 且' + (y % 400 === 0 ? '能' : '不能') + '被 400 整除（世纪年）' : '（非世纪年）')],
    ['上一个闰年', prev > 0 ? prev : '—'],
    ['下一个闰年', next],
    ['距今', next - y + ' 年后']
  ]));
  var list = [];
  for (var i = y; list.length < 12 && i < y + 60; i++) if (isLeap(i)) list.push(i);
  box.appendChild(T.el('span', { text: '未来 12 个闰年', class: 'field' }));
  box.appendChild(T.el('p', { text: list.join(' · '), style: 'font-family:var(--font-mono)' }));
}
year.addEventListener('input', run);
app.appendChild(T.row([T.el('span', { text: '年份' }), year]));
app.appendChild(box);
run();
})();
</script>
