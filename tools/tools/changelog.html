  var ul = T.el('ul', { style: 'margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:13.5px' });
  entry[2].forEach(function (item) {
    ul.appendChild(T.el('li', { text: item, style: 'margin:4px 0' }));
  });
  card.appendChild(ul);
  app.appendChild(card);
});
})();
