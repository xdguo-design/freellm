<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock 数据生成 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('Mock 数据生成', '随机 JSON 假数据生成', 'mock-data');

  var template = T.textarea('{\n  "name": "{{name}}",\n  "age": {{int(18,65)}},\n  "email": "{{email}}",\n  "phone": "{{phone}}",\n  "address": "{{city}}",\n  "active": {{bool}}\n}');
  var count = T.el('input', { type: 'number', value: '5', min: '1', max: '100', style: 'width:80px' });
  var output = T.textarea('生成结果', false);
  output.readOnly = true;

  var generateBtn = T.button('生成', generate, true);
  var copyBtn = T.copyBtn(function () { return output.value; });

  var NAMES = ['张三', '李四', '王五', '赵六', '钱七', '孙八', '周九', '吴十'];
  var CITIES = ['北京', '上海', '广州', '深圳', '杭州', '成都', '武汉', '西安'];
  var DOMAINS = ['qq.com', '163.com', 'gmail.com', 'outlook.com'];

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randPhone() { return '1' + [3,5,7,8,9][randInt(0,4)] + String(randInt(100000000, 999999999)); }
  function randEmail() { return 'user' + randInt(1000,9999) + '@' + rand(DOMAINS); }

  function generate() {
    var tpl = template.value;
    var n = parseInt(count.value) || 5;
    var results = [];

    for (var i = 0; i < n; i++) {
      var item = tpl
        .replace(/\{\{name\}\}/g, rand(NAMES))
        .replace(/\{\{int\((\d+),(\d+)\)\}\}/g, function (m, min, max) { return randInt(parseInt(min), parseInt(max)); })
        .replace(/\{\{email\}\}/g, randEmail())
        .replace(/\{\{phone\}\}/g, randPhone())
        .replace(/\{\{city\}\}/g, rand(CITIES))
        .replace(/\{\{bool\}\}/g, Math.random() > 0.5 ? 'true' : 'false');
      try {
        results.push(JSON.parse(item));
      } catch (e) {
        results.push(item);
      }
    }
    output.value = JSON.stringify(results, null, 2);
  }

  generateBtn.addEventListener('click', generate);

  app.appendChild(T.el('div', { class: 'field', text: '模板语法: {{name}} {{int(min,max)}} {{email}} {{phone}} {{city}} {{bool}}' }));
  app.appendChild(T.el('div', { class: 'row' }, [T.el('span', { text: '数量' }), count, generateBtn, copyBtn]));
  app.appendChild(T.el('div', { class: 'pane' }, [template]));
  app.appendChild(T.el('div', { class: 'pane' }, [output]));

  generate();
})();
</script>
</body>
</html>
