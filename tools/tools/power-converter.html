<title>功率单位换算 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">

</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/tools/js/lib-crypto.js"></script>
<script src="/tools/js/lib-format.js"></script>
<script src="/tools/js/lib-utils.js"></script>

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('功率单位换算', 'W / kW / 马力 等', 'power-converter');
var value = T.num(1, { style: 'width:130px' });
var from = T.select([{"value": "W (瓦特)", "label": "W (瓦特)"}, {"value": "kW", "label": "kW"}, {"value": "MW", "label": "MW"}, {"value": "hp (机械马力)", "label": "hp (机械马力)"}, {"value": "hp (公制马力)", "label": "hp (公制马力)"}, {"value": "ft·lb/s", "label": "ft·lb/s"}], "kW");
var to = T.select([{"value": "W (瓦特)", "label": "W (瓦特)"}, {"value": "kW", "label": "kW"}, {"value": "MW", "label": "MW"}, {"value": "hp (机械马力)", "label": "hp (机械马力)"}, {"value": "hp (公制马力)", "label": "hp (公制马力)"}, {"value": "ft·lb/s", "label": "ft·lb/s"}], "W (瓦特)");
var output = T.input('', { class: 'grow mono', readonly: '' });
var table = T.el('div');
var U = {"W (瓦特)": 1, "kW": 1000.0, "MW": 1000000.0, "hp (机械马力)": 745.6999, "hp (公制马力)": 735.4988, "ft·lb/s": 1.35582};
function cv(v, f, t) {
  if (f === t) return v;
  return v * U[f] / U[t];
}
function run() {
  var v = +value.value;
  if (isNaN(v)) { output.value = ''; return; }
  output.value = +(cv(v, from.value, to.value).toPrecision(10));
  var rows = [];
  Object.keys(U).forEach(function (k) {
    rows.push([k, +(cv(v, from.value, k).toPrecision(8))]);
  });
  T.clearEl(table).appendChild(T.kvTable(rows));
}
[value, from, to].forEach(function (el) { el.addEventListener('input', run); });
app.appendChild(T.row([value, from, T.el('span', { text: '→' }), to, output]));
app.appendChild(T.el('span', { text: '换算到全部单位', class: 'field' }));
app.appendChild(table);
run();
})();
</script>
