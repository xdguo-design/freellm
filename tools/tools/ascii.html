<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>ASCII 对照表 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">

</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/tools/js/lib-crypto.js"></script>
<script src="/tools/js/lib-format.js"></script>
<script src="/tools/js/lib-utils.js"></script>

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('ASCII 对照表', '0-127 完整 ASCII 字符对照（十进制 / 十六进制 / 字符）', 'ascii');
function buildSearch(tableWrap) {
  var search = T.input('', { class: 'grow', placeholder: '搜索过滤…' });
  search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase();
    Array.from(tableWrap.querySelectorAll('tbody tr')).forEach(function (tr) {
      tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
  return search;
}

var NAMES = { 0: 'NUL 空字符', 7: 'BEL 响铃', 8: 'BS 退格', 9: 'TAB 制表', 10: 'LF 换行', 13: 'CR 回车', 27: 'ESC 退出', 32: '空格', 127: 'DEL 删除' };
var rows = [];
for (var i = 0; i < 128; i++) {
  var ch = i < 32 || i === 127 ? '·' : String.fromCharCode(i);
  rows.push([i, '0x' + i.toString(16).toUpperCase().padStart(2, '0'), ch, NAMES[i] || (i < 32 ? '控制字符' : '')]);
}
var wrap = T.el('div');
wrap.appendChild(T.refTable(['十进制', '十六进制', '字符', '名称'], rows, function (r) { T.copy(String(r[0])); }));
app.appendChild(T.row([buildSearch(wrap), T.el('span', { text: '点击行复制十进制码' })]));
app.appendChild(wrap);
})();
</script>
