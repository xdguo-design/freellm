<title>全角半角转换 · FreeLLM</title>

</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/tools/js/lib-crypto.js"></script>
<script src="/tools/js/lib-format.js"></script>
<script src="/tools/js/lib-utils.js"></script>

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('全角半角转换', '全角字符 ↔ 半角字符互转（字母数字标点空格）', 'full-half');
var input = T.textarea('Ｈｅｌｌｏ　Ｗｏｒｌｄ！１２３');
input.value = 'Ｈｅｌｌｏ　Ｗｏｒｌｄ！１２３';
var output = T.out('');
var mode = T.select([{value:'h2f',label:'半角 → 全角'},{value:'f2h',label:'全角 → 半角'}],'f2h');
function run() {
  var v = input.value;
  if (mode.value === 'f2h') {
    output.value = v.replace(/[\uFF01-\uFF5E]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/\u3000/g, ' ');
  } else {
    output.value = v.replace(/[\x20-\x7E]/g, function (c) {
      if (c === ' ') return '\u3000';
      return String.fromCharCode(c.charCodeAt(0) + 0xFEE0);
    });
  }
}
[input, mode].forEach(function (el) { el.addEventListener('input', run); });
app.appendChild(T.pane([T.field('输入', input), T.field('输出', output)]));
app.appendChild(T.row([mode, T.btnCopy(function () { return output.value; })]));
run();
})();
</script>
