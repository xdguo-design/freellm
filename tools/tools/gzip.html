<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gzip 压缩 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('Gzip 压缩', '文本压缩/解压，显示压缩率', 'gzip');

  var mode = T.select([
    { value: 'compress', label: '压缩' },
    { value: 'decompress', label: '解压' }
  ]);
  var input = T.textarea('输入文本...');
  var output = T.textarea('结果', false);
  output.readOnly = true;

  var copyBtn = T.copyBtn(function () { return output.value; });
  var downloadBtn = T.button('下载结果', function () {
    T.download('gzip-result.bin', output.value);
  });

  var info = T.el('span', { class: 'badge', text: '' });

  async function run() {
    var v = input.value;
    if (!v) { output.value = ''; info.textContent = ''; return; }
    try {
      if (mode.value === 'compress') {
        var stream = new Blob([v]).stream().pipeThrough(new CompressionStream('gzip'));
        var compressed = await new Response(stream).arrayBuffer();
        var hex = Array.from(new Uint8Array(compressed)).map(function (b) {
          return b.toString(16).padStart(2, '0');
        }).join('');
        output.value = hex;
        var ratio = ((1 - compressed.byteLength / new TextEncoder().encode(v).byteLength) * 100).toFixed(1);
        info.textContent = '压缩率: ' + ratio + '% (' + compressed.byteLength + ' bytes)';
      } else {
        var clean = v.replace(/[^0-9a-fA-F]/g, '');
        var bytes = new Uint8Array(clean.length / 2);
        for (var i = 0; i < bytes.length; i++) {
          bytes[i] = parseInt(clean.substr(i * 2, 2), 16);
        }
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        var decompressed = await new Response(stream).text();
        output.value = decompressed;
        info.textContent = '解压完成';
      }
    } catch (e) {
      output.value = '⚠ 操作失败: ' + e.message;
      info.textContent = '';
    }
  }

  mode.addEventListener('change', run);
  input.addEventListener('input', function () { setTimeout(run, 200); });

  app.appendChild(T.el('div', { class: 'row' }, [mode, info, copyBtn, downloadBtn]));
  app.appendChild(T.el('div', { class: 'pane' }, [input]));
  app.appendChild(T.el('div', { class: 'pane' }, [output]));
})();
</script>
</body>
</html>
