<title>存储容量换算 · FreeLLM</title>

<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/tools/js/lib-crypto.js"></script>

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('存储容量换算', 'Byte / KB / MB / GB / TB（二进制与十进制）', 'storage');
var value = T.num(1, { style: 'width:130px' });
var from = T.select([{"value": "B (字节)", "label": "B (字节)"}, {"value": "KB (1000)", "label": "KB (1000)"}, {"value": "MB (1000²)", "label": "MB (1000²)"}, {"value": "GB (1000³)", "label": "GB (1000³)"}, {"value": "TB (1000⁴)", "label": "TB (1000⁴)"}, {"value": "KiB (1024)", "label": "KiB (1024)"}, {"value": "MiB (1024²)", "label": "MiB (1024²)"}, {"value": "GiB (1024³)", "label": "GiB (1024³)"}, {"value": "TiB (1024⁴)", "label": "TiB (1024⁴)"}], "GB (1000³)");
var to = T.select([{"value": "B (字节)", "label": "B (字节)"}, {"value": "KB (1000)", "label": "KB (1000)"}, {"value": "MB (1000²)", "label": "MB (1000²)"}, {"value": "GB (1000³)", "label": "GB (1000³)"}, {"value": "TB (1000⁴)", "label": "TB (1000⁴)"}, {"value": "KiB (1024)", "label": "KiB (1024)"}, {"value": "MiB (1024²)", "label": "MiB (1024²)"}, {"value": "GiB (1024³)", "label": "GiB (1024³)"}, {"value": "TiB (1024⁴)", "label": "TiB (1024⁴)"}], "B (字节)");
var output = T.input('', { class: 'grow mono', readonly: '' });
var table = T.el('div');
var U = {"B (字节)": 1, "KB (1000)": 1000.0, "MB (1000²)": 1000000.0, "GB (1000³)": 1000000000.0, "TB (1000⁴)": 1000000000000.0, "KiB (1024)": 1024, "MiB (1024²)": 1048576, "GiB (1024³)": 1073741824, "TiB (1024⁴)": 1099511627776};
function cv(v, f, t) {
  if (f === t) return v;
  return v * U[f] / U[t];
}
function run() {
  var v = +value.value;
  if (isNaN(v)) { output.value = ''; return; }
  output.value = +(cv(v, from.value, to.value).toPrecision(10));
  var rows = [];
  Object.keys(U).forEach(function (k) {
    rows.push([k, +(cv(v, from.value, k).toPrecision(8))]);
  });
  T.clearEl(table).appendChild(T.kvTable(rows));
}
[value, from, to].forEach(function (el) { el.addEventListener('input', run); });
app.appendChild(T.row([value, from, T.el('span', { text: '→' }), to, output]));
app.appendChild(T.el('span', { text: '换算到全部单位', class: 'field' }));
app.appendChild(table);
run();
})();
</script>
