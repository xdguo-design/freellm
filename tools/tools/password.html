<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>密码生成器 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('密码生成器', '安全随机密码在线生成', 'password');

  var length = T.el('input', { type: 'range', min: '4', max: '64', value: '16' });
  var lengthLabel = T.el('span', { text: '16', style: 'width:30px' });

  var opts = {
    upper: T.el('label', { html: '<input type="checkbox" checked> 大写字母 (A-Z)' }),
    lower: T.el('label', { html: '<input type="checkbox" checked> 小写字母 (a-z)' }),
    numbers: T.el('label', { html: '<input type="checkbox" checked> 数字 (0-9)' }),
    symbols: T.el('label', { html: '<input type="checkbox" checked> 符号 (!@#$...)' }),
    exclude: T.el('label', { html: '<input type="checkbox"> 排除相似字符 (il1Io0O)' })
  };

  var output = T.el('input', { type: 'text', readonly: true, style: 'width:100%;font-size:1.2em;font-family:monospace;text-align:center;padding:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px' });
  var strength = T.el('div', { style: 'height:8px;border-radius:4px;margin:8px 0;transition:all 0.3s' });

  var generateBtn = T.button('生成密码', generate, true);
  var copyBtn = T.copyBtn(function () { return output.value; });

  var CHARS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };

  function generate() {
    var len = parseInt(length.value);
    var chars = '';
    if (opts.upper.checked) chars += CHARS.upper;
    if (opts.lower.checked) chars += CHARS.lower;
    if (opts.numbers.checked) chars += CHARS.numbers;
    if (opts.symbols.checked) chars += CHARS.symbols;

    if (opts.exclude.checked) {
      chars = chars.replace(/[il1Io0O]/g, '');
    }

    if (!chars) { output.value = '请选择至少一种字符类型'; return; }

    var result = '';
    var array = new Uint32Array(len);
    crypto.getRandomValues(array);
    for (var i = 0; i < len; i++) {
      result += chars[array[i] % chars.length];
    }
    output.value = result;
    updateStrength(result);
  }

  function updateStrength(pwd) {
    var score = 0;
    if (pwd.length >= 8) score++;
    if (pwd.length >= 12) score++;
    if (pwd.length >= 16) score++;
    if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
    if (/\d/.test(pwd)) score++;
    if (/[^a-zA-Z0-9]/.test(pwd)) score++;

    var colors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#27ae60', '#1abc9c'];
    var labels = ['很弱', '弱', '一般', '较强', '强', '很强'];
    var idx = Math.min(score, colors.length) - 1;
    if (idx < 0) idx = 0;

    strength.style.backgroundColor = colors[idx];
    strength.title = labels[idx];
  }

  length.addEventListener('input', function () {
    lengthLabel.textContent = length.value;
    generate();
  });

  Object.values(opts).forEach(function (el) {
    el.querySelector('input').addEventListener('change', generate);
  });

  app.appendChild(T.el('div', { class: 'field', text: '密码长度' }));
  app.appendChild(T.el('div', { class: 'row' }, [length, lengthLabel]));
  app.appendChild(T.el('div', { class: 'row', style: 'flex-wrap:wrap;gap:8px' }, Object.values(opts)));
  app.appendChild(T.el('div', { class: 'row' }, [generateBtn, copyBtn]));
  app.appendChild(output);
  app.appendChild(strength);

  generate();
})();
</script>
</body>
</html>
