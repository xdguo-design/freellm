<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 编辑器 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('Markdown 编辑器', '在线 Markdown 编辑与预览', 'markdown');

  var input = T.textarea('# Hello World\n\n这是一个 **Markdown** 编辑器。\n\n## 功能\n\n- 粗体 **text**\n- 斜体 *text*\n- 删除线 ~~text~~\n- 代码 `code`\n\n## 列表\n\n1. 第一项\n2. 第二项\n3. 第三项\n\n> 引用文本\n\n```js\nconsole.log("Hello!");\n```');

  var preview = T.el('div', { class: 'output', style: 'padding:16px;min-height:200px;line-height:1.6' });

  var copyMd = T.copyBtn(function () { return input.value; });
  var copyHtml = T.copyBtn(function () { return preview.innerHTML; });

  function renderMarkdown(md) {
    var html = md
      .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto"><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code style="background:var(--code-bg);padding:2px 6px;border-radius:4px">$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/~~(.+?)~~/g, '<del>$1</del>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      .replace(/^> (.+)$/gm, '<blockquote style="border-left:4px solid var(--accent);padding-left:16px;color:var(--muted);margin:8px 0">$1</blockquote>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    return '<p>' + html + '</p>';
  }

  function run() {
    preview.innerHTML = renderMarkdown(input.value);
  }

  input.addEventListener('input', function () { setTimeout(run, 100); });

  app.appendChild(T.el('div', { class: 'row' }, [copyMd, copyHtml]));
  app.appendChild(T.el('div', { class: 'row', style: 'gap:10px' }, [
    T.el('div', { class: 'pane', style: 'flex:1' }, [input]),
    T.el('div', { class: 'pane', style: 'flex:1' }, [preview])
  ]));

  run();
})();
</script>
</body>
</html>
