<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>

<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('SVG 在线编辑', '可视化编辑 SVG 图形：改属性 / 实时预览 / 导出', 'svg-editor');
var input = T.textarea('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">\n  <rect x="10" y="10" width="100" height="60" rx="10" fill="#1744E8"/>\n  <circle cx="180" cy="80" r="50" fill="#FFB88C"/>\n  <text x="120" y="140" text-anchor="middle" font-size="16" fill="#787774">SVG 编辑器</text>\n</svg>', true);
input.value = '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">\n  <rect x="10" y="10" width="100" height="60" rx="10" fill="#1744E8"/>\n  <circle cx="180" cy="80" r="50" fill="#FFB88C"/>\n  <text x="120" y="140" text-anchor="middle" font-size="16" fill="#787774">SVG 编辑器</text>\n</svg>';
input.style.minHeight = '220px';
var preview = T.el('div', { class: 'output', style: 'min-height:220px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:auto' });
function run() {
  try {
    preview.innerHTML = input.value;
  } catch (e) { preview.textContent = '⚠ ' + e.message; }
}
input.addEventListener('input', T.debounce(run, 300));
app.appendChild(T.pane([T.field('SVG 源码', input), T.el('div', { class: 'field' }, [T.el('span', { text: '预览' }), preview])]));
app.appendChild(T.row([
  T.button('下载 SVG', function () { T.download('shape.svg', input.value, 'image/svg+xml'); }, true),
  T.button('复制源码', function () { T.copy(input.value); }),
  T.button('导出 PNG', function () {
    var svg = preview.querySelector('svg');
    if (!svg) return;
    var img = new Image();
    img.onload = function () {
      var c = T.el('canvas');
      c.width = img.width || 480;
      c.height = img.height || 320;
      c.getContext('2d').drawImage(img, 0, 0);
      T.dlCanvas(c, 'shape.png');
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(input.value);
  })
]));
run();
app.appendChild(T.el('hr', { class: 'hr' }));
app.appendChild(T.el('span', { text: 'SVG 资源导航（素材站 / 在线工具）', class: 'field' }));
var RES = [
  ['SVG Repo', 'https://www.svgrepo.com/', '50 万+ 免费 SVG 图标与插画，多数可商用'],
  ['Iconify', 'https://iconify.design/', '聚合 150+ 开源图标集，在线检索导出 SVG'],
  ['Simple Icons', 'https://simpleicons.org/', '3000+ 品牌 Logo SVG，按名称搜索'],
  ['unDraw', 'https://undraw.co/illustrations', '可自定义主色的开源插画（SVG / PNG）'],
  ['OpenMoji', 'https://openmoji.org/', '开源 Emoji 风格 SVG 图形库'],
  ['SVGOMG', 'https://jakearchibald.github.io/svgomg/', '在线 SVG 瘦身压缩（SVGO 可视化版）'],
  ['yoksel · URL-encoder for SVG', 'https://yoksel.github.io/url-encoder/', 'SVG 转 data URI，可直接内嵌 CSS background'],
  ['yoksel · SVG Filters', 'https://yoksel.github.io/svg-filters/', 'SVG 滤镜效果在线调参与生成'],
  ['SVG Path Editor (yqnn)', 'https://yqnn.github.io/svg-path-editor/', '路径 d 值可视化编辑、控制点拖拽预览'],
  ['SVG Viewer', 'https://www.svgviewer.dev/', '在线预览 / 压缩 / 转 React 组件'],
  ['Boxy SVG', 'https://boxy-svg.com/', '浏览器内的专业级 SVG 矢量编辑器'],
  ['Haikei', 'https://haikei.app/', '生成波浪 / 斑点 / 渐变等 SVG 背景素材'],
  ['Get Waves', 'https://getwaves.io/', '波浪分隔线 SVG 生成器'],
  ['MDN SVG 参考', 'https://developer.mozilla.org/zh-CN/docs/Web/SVG', 'SVG 元素与属性权威文档']
];
var resBox = T.el('div');
RES.forEach(function (r) {
  var a = T.el('a', { href: r[1], target: '_blank', rel: 'noopener', text: r[0] });
  a.style.cssText = 'display:inline-block;margin:3px 6px 3px 0;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;text-decoration:none;color:var(--accent)';
  a.title = r[2];
  resBox.appendChild(a);
  var note = T.el('span', { text: r[2] + '　', style: 'color:var(--ink3);font-size:12px' });
  resBox.appendChild(note);
});
app.appendChild(resBox);
})();
</script>
