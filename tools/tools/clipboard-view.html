<title>剪贴板查看 · FreeLLM</title>

</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/tools/js/lib-crypto.js"></script>
<script src="/tools/js/lib-format.js"></script>
<script src="/tools/js/lib-utils.js"></script>

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('剪贴板查看', '读取剪贴板内容（文本），需浏览器授权', 'clipboard-view');
var output = T.out('剪贴板内容将显示在这里…');
var info = T.badge('—');
function read() {
  navigator.clipboard.readText().then(function (text) {
    output.value = text;
    info.textContent = text.length + ' 个字符';
    info.className = 'badge ok';
  }).catch(function (e) {
    info.textContent = '读取失败：' + e.message + '（需授权且页面处于前台）';
    info.className = 'badge warn';
  });
}
T.button('📋 读取剪贴板', read, true)
app.appendChild(T.row([T.button('📋 读取剪贴板', read, true), info]));
app.appendChild(T.pane([T.field('剪贴板内容', output)], true));
app.appendChild(T.row([T.button('复制内容', function () { T.copy(output.value); }),
  T.button('清空统计（写空值）', function () {
    navigator.clipboard.writeText('').then(function () { T.toast('已写入空内容'); });
  })]));
})();
</script>
