<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>密码强度检测 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('密码强度检测', '实时检测密码强度与安全性', 'password-check');

  var input = T.el('input', { type: 'password', placeholder: '输入密码...', style: 'width:100%;font-size:1.2em;padding:12px' });
  var toggle = T.button('显示/隐藏', function () {
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  var strengthBar = T.el('div', { style: 'height:8px;border-radius:4px;background:#e0e0e0;margin:16px 0;overflow:hidden' });
  var strengthFill = T.el('div', { style: 'height:100%;width:0;transition:all 0.3s;border-radius:4px' });
  strengthBar.appendChild(strengthFill);

  var result = T.el('div', { class: 'output dark', style: 'padding:16px' });

  function checkStrength() {
    var pwd = input.value;
    if (!pwd) {
      strengthFill.style.width = '0';
      result.textContent = '';
      return;
    }

    var score = 0;
    var checks = [];

    // Length
    if (pwd.length >= 8) { score++; checks.push('✅ 长度 >= 8'); }
    else checks.push('❌ 长度 < 8');

    if (pwd.length >= 12) { score++; checks.push('✅ 长度 >= 12'); }
    else checks.push('❌ 长度 < 12');

    // Character types
    if (/[a-z]/.test(pwd)) { score++; checks.push('✅ 包含小写字母'); }
    else checks.push('❌ 缺少小写字母');

    if (/[A-Z]/.test(pwd)) { score++; checks.push('✅ 包含大写字母'); }
    else checks.push('❌ 缺少大写字母');

    if (/\d/.test(pwd)) { score++; checks.push('✅ 包含数字'); }
    else checks.push('❌ 缺少数字');

    if (/[^a-zA-Z0-9]/.test(pwd)) { score++; checks.push('✅ 包含特殊字符'); }
    else checks.push('❌ 缺少特殊字符');

    // Patterns
    if (/(.)\1{2,}/.test(pwd)) { score--; checks.push('⚠️ 包含重复字符'); }
    if (/^[a-zA-Z]+$/.test(pwd)) { score--; checks.push('⚠️ 仅字母'); }
    if (/^[0-9]+$/.test(pwd)) { score--; checks.push('⚠️ 仅数字'); }

    var labels = ['很弱', '弱', '一般', '较强', '强', '很强', '非常强'];
    var colors = ['#e74c3c', '#e67e22', '#f39c12', '#2ecc71', '#27ae60', '#1abc9c', '#16a085'];
    var idx = Math.max(0, Math.min(score, colors.length - 1));

    strengthFill.style.width = ((idx + 1) / colors.length * 100) + '%';
    strengthFill.style.backgroundColor = colors[idx];

    result.innerHTML = '<strong>强度: ' + labels[idx] + '</strong><br><br>' + checks.join('<br>');
  }

  input.addEventListener('input', checkStrength);

  app.appendChild(T.el('div', { class: 'row' }, [input, toggle]));
  app.appendChild(strengthBar);
  app.appendChild(result);
})();
</script>
</body>
</html>
