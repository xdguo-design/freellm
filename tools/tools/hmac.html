<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMAC 哈希 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('HMAC 哈希', 'HMAC 消息认证码在线计算', 'hmac');

  var algo = T.select([
    { value: 'SHA-256', label: 'HMAC-SHA256' },
    { value: 'SHA-1', label: 'HMAC-SHA1' },
    { value: 'SHA-384', label: 'HMAC-SHA384' },
    { value: 'SHA-512', label: 'HMAC-SHA512' }
  ]);
  var key = T.el('input', { type: 'text', placeholder: '输入密钥...', style: 'flex:1' });
  var input = T.textarea('输入消息...');
  var output = T.textarea('HMAC 值', false);
  output.readOnly = true;

  var copyBtn = T.copyBtn(function () { return output.value; });

  async function run() {
    var v = input.value;
    var k = key.value;
    if (!v || !k) { output.value = ''; return; }
    try {
      var keyBytes = new TextEncoder().encode(k);
      var msgBytes = new TextEncoder().encode(v);
      var cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: algo.value }, false, ['sign']);
      var signature = await crypto.subtle.sign('HMAC', cryptoKey, msgBytes);
      output.value = Array.from(new Uint8Array(signature)).map(function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    } catch (e) {
      output.value = '⚠ 计算失败: ' + e.message;
    }
  }

  algo.addEventListener('change', run);
  key.addEventListener('input', function () { setTimeout(run, 100); });
  input.addEventListener('input', function () { setTimeout(run, 100); });

  app.appendChild(T.el('div', { class: 'row' }, [algo, copyBtn]));
  app.appendChild(T.el('div', { class: 'row' }, [key]));
  app.appendChild(T.el('div', { class: 'pane' }, [input]));
  app.appendChild(T.el('div', { class: 'pane' }, [output]));
})();
</script>
</body>
</html>
