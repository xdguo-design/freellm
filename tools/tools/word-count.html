<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>字数统计 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('字数统计', '字符/单词/行/段落计数', 'word-count');

  var input = T.textarea('输入文本...');
  var stats = T.el('div', { class: 'output dark', style: 'white-space:pre-wrap' });

  var copyBtn = T.copyBtn(function () { return stats.textContent; });

  function run() {
    var v = input.value;
    if (!v) {
      stats.textContent = '字符: 0\n单词: 0\n行数: 0\n段落: 0\n中文字符: 0';
      return;
    }
    var chars = v.length;
    var words = v.trim() ? v.trim().split(/\s+/).length : 0;
    var lines = v.split('\n').length;
    var paragraphs = v.trim() ? v.trim().split(/\n\s*\n/).length : 0;
    var chinese = (v.match(/[\u4e00-\u9fa5]/g) || []).length;
    stats.textContent = '字符: ' + chars + '\n单词: ' + words + '\n行数: ' + lines + '\n段落: ' + paragraphs + '\n中文字符: ' + chinese;
  }

  input.addEventListener('input', function () { setTimeout(run, 100); });

  app.appendChild(T.el('div', { class: 'row' }, [copyBtn]));
  app.appendChild(T.el('div', { class: 'pane' }, [input]));
  app.appendChild(stats);
})();
</script>
</body>
</html>
