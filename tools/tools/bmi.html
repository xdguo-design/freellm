<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMI 计算器 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('BMI 计算器', '身体质量指数', 'bmi');

  var height = T.el('input', { type: 'number', placeholder: '身高 (cm)', min: '1', max: '300', style: 'flex:1' });
  var weight = T.el('input', { type: 'number', placeholder: '体重 (kg)', min: '1', max: '500', style: 'flex:1' });

  var result = T.el('div', { class: 'output dark', style: 'text-align:center;padding:20px' });
  var bar = T.el('div', { style: 'height:20px;border-radius:10px;background:linear-gradient(to right,#3498db,#2ecc71,#f1c40f,#e67e22,#e74c3c);margin:16px 0' });
  var marker = T.el('div', { style: 'width:4px;height:30px;background:#000;position:absolute;top:-5px;transition:left 0.3s' });

  var copyBtn = T.copyBtn(function () { return result.textContent; });

  function run() {
    var h = parseFloat(height.value);
    var w = parseFloat(weight.value);
    if (!h || !w || h <= 0 || w <= 0) {
      result.textContent = '请输入身高和体重';
      marker.style.left = '0';
      return;
    }

    var bmi = w / ((h / 100) * (h / 100));
    var category, color;
    if (bmi < 18.5) { category = '偏瘦'; color = '#3498db'; }
    else if (bmi < 24) { category = '正常'; color = '#2ecc71'; }
    else if (bmi < 28) { category = '偏胖'; color = '#f1c40f'; }
    else { category = '肥胖'; color = '#e74c3c'; }

    result.textContent = 'BMI: ' + bmi.toFixed(1) + ' (' + category + ')';
    result.style.color = color;

    var pos = Math.min(100, Math.max(0, (bmi - 15) / 30 * 100));
    marker.style.left = pos + '%';
  }

  height.addEventListener('input', function () { setTimeout(run, 100); });
  weight.addEventListener('input', function () { setTimeout(run, 100); });

  app.appendChild(T.el('div', { class: 'row' }, [height, weight, copyBtn]));
  app.appendChild(result);
  app.appendChild(T.el('div', { style: 'position:relative' }, [bar, marker]));
  app.appendChild(T.el('div', { class: 'row', style: 'justify-content:space-between;font-size:0.8em;color:var(--muted)' }, [
    T.el('span', { text: '偏瘦 <18.5' }),
    T.el('span', { text: '正常 18.5-24' }),
    T.el('span', { text: '偏胖 24-28' }),
    T.el('span', { text: '肥胖 >28' })
  ]));
})();
</script>
</body>
</html>
