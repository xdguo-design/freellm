<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UUID 生成器 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('UUID 生成器', 'UUID/GUID 在线批量生成', 'uuid');

  var count = T.el('input', { type: 'number', value: '10', min: '1', max: '1000', style: 'width:80px' });
  var version = T.select([
    { value: '4', label: 'UUID v4 (随机)' },
    { value: '1', label: 'UUID v1 (时间)' }
  ]);
  var output = T.textarea('生成结果', false);
  output.readOnly = true;

  var generateBtn = T.button('生成', generate, true);
  var copyBtn = T.copyBtn(function () { return output.value; });
  var downloadBtn = T.button('下载', function () {
    T.download('uuids.txt', output.value);
  });

  function uuidv4() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      var v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function uuidv1() {
    var now = Date.now();
    var timeHex = now.toString(16).padStart(12, '0');
    return timeHex.slice(0, 8) + '-' + timeHex.slice(8, 12) + '-1' + 
      Math.random().toString(16).slice(2, 5) + '-' + 
      (8 + Math.random() * 4 | 0).toString(16) + 
      Math.random().toString(16).slice(2, 6) + '-' + 
      Math.random().toString(16).slice(2, 14);
  }

  function generate() {
    var n = parseInt(count.value) || 10;
    var results = [];
    for (var i = 0; i < n; i++) {
      results.push(version.value === '4' ? uuidv4() : uuidv1());
    }
    output.value = results.join('\n');
  }

  generateBtn.addEventListener('click', generate);
  count.addEventListener('input', generate);

  app.appendChild(T.el('div', { class: 'row' }, [
    T.el('span', { text: '数量' }), count, version, generateBtn, copyBtn, downloadBtn
  ]));
  app.appendChild(T.el('div', { class: 'pane' }, [output]));
  generate();
})();
</script>
</body>
</html>
