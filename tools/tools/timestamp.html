<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间戳转换 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('时间戳转换', 'Unix 时间戳与日期时间互转', 'timestamp');

  var now = T.el('span', { class: 'badge blue', style: 'font-family:monospace' });
  var refresh = function () {
    now.textContent = '当前时间戳: ' + Math.floor(Date.now() / 1000);
  };
  refresh();
  setInterval(refresh, 1000);

  var tsInput = T.el('input', { type: 'number', placeholder: '输入时间戳（秒或毫秒）', style: 'flex:1;font-family:monospace' });
  var dateInput = T.el('input', { type: 'datetime-local', step: '1', style: 'flex:1' });

  var tsResult = T.el('div', { class: 'output dark', style: 'font-family:monospace' });
  var dateResult = T.el('div', { class: 'output dark', style: 'font-family:monospace' });

  var copyTs = T.copyBtn(function () { return tsResult.textContent; });
  var copyDate = T.copyBtn(function () { return dateResult.textContent; });

  function tsToDate() {
    var v = tsInput.value.trim();
    if (!v) { tsResult.textContent = ''; return; }
    var ts = parseInt(v);
    if (v.length <= 10) ts *= 1000;
    var d = new Date(ts);
    if (isNaN(d.getTime())) { tsResult.textContent = '无效时间戳'; return; }
    dateInput.value = d.toISOString().slice(0, 19);
    tsResult.textContent = '本地时间: ' + d.toLocaleString() + '\nISO 8601: ' + d.toISOString() + '\nUTC: ' + d.toUTCString();
  }

  function dateToTs() {
    var v = dateInput.value;
    if (!v) { dateResult.textContent = ''; return; }
    var d = new Date(v);
    if (isNaN(d.getTime())) { dateResult.textContent = '无效日期'; return; }
    tsInput.value = Math.floor(d.getTime() / 1000);
    dateResult.textContent = '秒: ' + Math.floor(d.getTime() / 1000) + '\n毫秒: ' + d.getTime();
  }

  tsInput.addEventListener('input', function () { setTimeout(tsToDate, 100); });
  dateInput.addEventListener('input', function () { setTimeout(dateToTs, 100); });

  app.appendChild(now);
  app.appendChild(T.el('div', { class: 'field', text: '时间戳 → 日期:' }));
  app.appendChild(T.el('div', { class: 'row' }, [tsInput, copyTs]));
  app.appendChild(tsResult);
  app.appendChild(T.el('div', { class: 'field', text: '日期 → 时间戳:' }));
  app.appendChild(T.el('div', { class: 'row' }, [dateInput, copyDate]));
  app.appendChild(dateResult);
})();
</script>
</body>
</html>
