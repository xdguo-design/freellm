<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('能量单位换算', 'J / kcal / kWh / BTU 等', 'energy-converter');
var value = T.num(1, { style: 'width:130px' });
var from = T.select([{"value": "J (焦耳)", "label": "J (焦耳)"}, {"value": "kJ", "label": "kJ"}, {"value": "cal (卡)", "label": "cal (卡)"}, {"value": "kcal (大卡)", "label": "kcal (大卡)"}, {"value": "Wh", "label": "Wh"}, {"value": "kWh (度)", "label": "kWh (度)"}, {"value": "BTU", "label": "BTU"}, {"value": "eV", "label": "eV"}], "kJ");
var to = T.select([{"value": "J (焦耳)", "label": "J (焦耳)"}, {"value": "kJ", "label": "kJ"}, {"value": "cal (卡)", "label": "cal (卡)"}, {"value": "kcal (大卡)", "label": "kcal (大卡)"}, {"value": "Wh", "label": "Wh"}, {"value": "kWh (度)", "label": "kWh (度)"}, {"value": "BTU", "label": "BTU"}, {"value": "eV", "label": "eV"}], "J (焦耳)");
var output = T.input('', { class: 'grow mono', readonly: '' });
var table = T.el('div');
var U = {"J (焦耳)": 1, "kJ": 1000.0, "cal (卡)": 4.184, "kcal (大卡)": 4184, "Wh": 3600, "kWh (度)": 3600000.0, "BTU": 1055.06, "eV": 1.602176634e-19};
function cv(v, f, t) {
  if (f === t) return v;
  return v * U[f] / U[t];
}
function run() {
  var v = +value.value;
  if (isNaN(v)) { output.value = ''; return; }
  output.value = +(cv(v, from.value, to.value).toPrecision(10));
  var rows = [];
  Object.keys(U).forEach(function (k) {
    rows.push([k, +(cv(v, from.value, k).toPrecision(8))]);
  });
  T.clearEl(table).appendChild(T.kvTable(rows));
}
[value, from, to].forEach(function (el) { el.addEventListener('input', run); });
app.appendChild(T.row([value, from, T.el('span', { text: '→' }), to, output]));
app.appendChild(T.el('span', { text: '换算到全部单位', class: 'field' }));
app.appendChild(table);
run();
})();
</script>
