<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素密度计算 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('像素密度计算', 'DPI/PPI 计算', 'pixel-density');

  var diagonal = T.el('input', { type: 'number', value: '15.6', step: '0.1', placeholder: '屏幕对角线 (英寸)', style: 'flex:1' });
  var widthRes = T.el('input', { type: 'number', value: '1920', placeholder: '水平分辨率', style: 'flex:1' });
  var heightRes = T.el('input', { type: 'number', value: '1080', placeholder: '垂直分辨率', style: 'flex:1' });

  var result = T.el('div', { class: 'output dark', style: 'padding:16px' });
  var copyBtn = T.copyBtn(function () { return result.textContent; });

  function calculate() {
    var d = parseFloat(diagonal.value) || 15.6;
    var w = parseInt(widthRes.value) || 1920;
    var h = parseInt(heightRes.value) || 1080;

    var ppi = Math.sqrt(w * w + h * h) / d;
    var physicalWidth = w / ppi * 25.4;
    var physicalHeight = h / ppi * 25.4;

    var category;
    if (ppi < 100) category = '低密度';
    else if (ppi < 200) category = '中密度';
    else if (ppi < 300) category = '高密度 (视网膜)';
    else category = '超高密度';

    result.innerHTML = '<table style="width:100%;border-collapse:collapse">' +
      '<tr><td style="padding:8px;color:var(--muted)">PPI</td><td style="padding:8px;text-align:right;font-weight:bold;color:var(--accent)">' + ppi.toFixed(1) + '</td></tr>' +
      '<tr><td style="padding:8px;color:var(--muted)">密度等级</td><td style="padding:8px;text-align:right">' + category + '</td></tr>' +
      '<tr><td style="padding:8px;color:var(--muted)">物理宽度</td><td style="padding:8px;text-align:right">' + physicalWidth.toFixed(1) + ' mm (' + (physicalWidth / 10).toFixed(1) + ' cm)</td></tr>' +
      '<tr><td style="padding:8px;color:var(--muted)">物理高度</td><td style="padding:8px;text-align:right">' + physicalHeight.toFixed(1) + ' mm (' + (physicalHeight / 10).toFixed(1) + ' cm)</td></tr>' +
      '</table>';
  }

  [diagonal, widthRes, heightRes].forEach(function (el) {
    el.addEventListener('input', function () { setTimeout(calculate, 100); });
  });

  app.appendChild(T.el('div', { class: 'row' }, [T.el('span', { text: '对角线' }), diagonal]));
  app.appendChild(T.el('div', { class: 'row' }, [T.el('span', { text: '宽度' }), widthRes, T.el('span', { text: '高度' }), heightRes, copyBtn]));
  app.appendChild(result);

  calculate();
})();
</script>
</body>
</html>
