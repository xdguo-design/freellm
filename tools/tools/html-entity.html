<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML 实体编解码 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('HTML 实体编解码', 'HTML 实体字符与原始字符互转', 'html-entity');

  var mode = T.select([
    { value: 'encode', label: '编码' },
    { value: 'decode', label: '解码' }
  ]);
  var input = T.textarea('输入文本...');
  var output = T.textarea('结果', false);
  output.readOnly = true;

  var copyBtn = T.copyBtn(function () { return output.value; });

  var entities = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
    '/': '&#x2F;',
    '`': '&#x60;',
    '=': '&#x3D;'
  };
  var reverseEntities = {};
  for (var k in entities) reverseEntities[entities[k]] = k;

  function run() {
    var v = input.value;
    if (!v) { output.value = ''; return; }
    if (mode.value === 'encode') {
      output.value = v.replace(/[&<>"'`=/]/g, function (c) { return entities[c]; });
    } else {
      var decoded = v;
      var entityRegex = /&(amp|lt|gt|quot|#[0-9]+|#x[0-9a-fA-F]+);/g;
      decoded = decoded.replace(entityRegex, function (m) {
        if (m === '&amp;') return '&';
        if (m === '&lt;') return '<';
        if (m === '&gt;') return '>';
        if (m === '&quot;') return '"';
        if (m.startsWith('&#x')) return String.fromCharCode(parseInt(m.slice(3, -1), 16));
        if (m.startsWith('&#')) return String.fromCharCode(parseInt(m.slice(2, -1)));
        return m;
      });
      output.value = decoded;
    }
  }

  mode.addEventListener('change', run);
  input.addEventListener('input', function () { setTimeout(run, 100); });

  app.appendChild(T.el('div', { class: 'row' }, [mode, copyBtn]));
  app.appendChild(T.el('div', { class: 'pane' }, [input]));
  app.appendChild(T.el('div', { class: 'pane' }, [output]));
})();
</script>
</body>
</html>
