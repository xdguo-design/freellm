<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>角度单位换算 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('角度单位换算', '度/弧度/梯度 等', 'angle-converter');

  var units = [
    { id: 'deg', name: '度 (°)' },
    { id: 'rad', name: '弧度 (rad)' },
    { id: 'grad', name: '梯度 (grad)' },
    { id: 'min', name: '角分 (\'') },
    { id: 'sec', name: '角秒 (\")' },
    { id: 'rev', name: '周 (rev)' }
  ];

  var factors = { deg: 1, rad: 180/Math.PI, grad: 0.9, min: 1/60, sec: 1/3600, rev: 360 };

  var inputs = {};
  units.forEach(function (u) {
    inputs[u.id] = T.el('input', { type: 'number', placeholder: u.name, style: 'flex:1' });
  });

  function run(source) {
    var val = parseFloat(inputs[source].value);
    if (isNaN(val)) {
      units.forEach(function (u) { if (u.id !== source) inputs[u.id].value = ''; });
      return;
    }

    var deg = val * factors[source];
    units.forEach(function (u) {
      if (u.id !== source) {
        inputs[u.id].value = (deg / factors[u.id]).toFixed(6).replace(/\.?0+$/, '');
      }
    });
  }

  units.forEach(function (u) {
    inputs[u.id].addEventListener('input', function () { setTimeout(function () { run(u.id); }, 100); });
    app.appendChild(T.el('div', { class: 'row' }, [
      T.el('span', { text: u.name, style: 'width:100px' }),
      inputs[u.id]
    ]));
  });

  inputs.deg.value = '180';
  run('deg');
})();
</script>
</body>
</html>
