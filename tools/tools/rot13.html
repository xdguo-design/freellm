<title>ROT13/ROT47 · FreeLLM</title>

</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/tools/js/lib-crypto.js"></script>
<script src="/tools/js/lib-format.js"></script>
<script src="/tools/js/lib-utils.js"></script>

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('ROT13/ROT47', '经典 ROT 系列编码：字母 ROT13，ASCII 可见字符 ROT47', 'rot13');
var input = T.textarea('输入文本…');
var output = T.out('输出…');
var info = T.badge('ROT13 与 ROT47 均为自反变换，再执行一次即还原');
function run() {
  var v = input.value;
  var r13 = v.replace(/[a-zA-Z]/g, function (c) {
    var base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0) - base + 13) % 26 + base);
  });
  var r47 = v.replace(/[!-~]/g, function (c) {
    return String.fromCharCode(33 + (c.charCodeAt(0) - 33 + 47) % 94);
  });
  output.value = 'ROT13: ' + r13 + '\nROT47: ' + r47;
}
input.addEventListener('input', run);
app.appendChild(T.pane([T.field('输入', input), T.field('输出', output)]));
app.appendChild(T.row([info, T.btnCopy(function () { return output.value; })]));
run();
})();
</script>
