<title>Base85 编码 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">

</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/tools/js/lib-crypto.js"></script>
<script src="/tools/js/lib-format.js"></script>
<script src="/tools/js/lib-utils.js"></script>

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('Base85 编码', 'Ascii85 编码与解码（PDF / Git 风格）', 'base85');
var input = T.textarea('输入文本（编码）或 Ascii85（解码）…');
var output = T.out('输出…');
var dir = T.select([{value:'enc',label:'编码'},{value:'dec',label:'解码'}],'enc');
function run() {
  var v = input.value.trim();
  if (!v) { output.value = ''; return; }
  try {
    output.value = dir.value === 'enc'
      ? LC.b85encode(T.textToBytes(v))
      : T.bytesToText(LC.b85decode(v));
  } catch (e) { output.value = '⚠ ' + e.message; }
}
[input, dir].forEach(function (el) { el.addEventListener('input', run); });
app.appendChild(T.pane([T.field('输入', input), T.field('输出', output)]));
app.appendChild(T.row([dir, T.btnCopy(function () { return output.value; })]));
run();
})();
</script>
