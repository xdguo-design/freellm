<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('压力单位换算', 'Pa / Bar / PSI / atm / mmHg 等', 'pressure-converter');
var value = T.num(1, { style: 'width:130px' });
var from = T.select([{"value": "Pa (帕斯卡)", "label": "Pa (帕斯卡)"}, {"value": "kPa", "label": "kPa"}, {"value": "MPa", "label": "MPa"}, {"value": "bar", "label": "bar"}, {"value": "mbar", "label": "mbar"}, {"value": "atm (标准大气压)", "label": "atm (标准大气压)"}, {"value": "psi (磅/英寸²)", "label": "psi (磅/英寸²)"}, {"value": "mmHg (托)", "label": "mmHg (托)"}], "bar");
var to = T.select([{"value": "Pa (帕斯卡)", "label": "Pa (帕斯卡)"}, {"value": "kPa", "label": "kPa"}, {"value": "MPa", "label": "MPa"}, {"value": "bar", "label": "bar"}, {"value": "mbar", "label": "mbar"}, {"value": "atm (标准大气压)", "label": "atm (标准大气压)"}, {"value": "psi (磅/英寸²)", "label": "psi (磅/英寸²)"}, {"value": "mmHg (托)", "label": "mmHg (托)"}], "Pa (帕斯卡)");
var output = T.input('', { class: 'grow mono', readonly: '' });
var table = T.el('div');
var U = {"Pa (帕斯卡)": 1, "kPa": 1000.0, "MPa": 1000000.0, "bar": 100000.0, "mbar": 100, "atm (标准大气压)": 101325, "psi (磅/英寸²)": 6894.757, "mmHg (托)": 133.322};
function cv(v, f, t) {
  if (f === t) return v;
  return v * U[f] / U[t];
}
function run() {
  var v = +value.value;
  if (isNaN(v)) { output.value = ''; return; }
  output.value = +(cv(v, from.value, to.value).toPrecision(10));
  var rows = [];
  Object.keys(U).forEach(function (k) {
    rows.push([k, +(cv(v, from.value, k).toPrecision(8))]);
  });
  T.clearEl(table).appendChild(T.kvTable(rows));
}
[value, from, to].forEach(function (el) { el.addEventListener('input', run); });
app.appendChild(T.row([value, from, T.el('span', { text: '→' }), to, output]));
app.appendChild(T.el('span', { text: '换算到全部单位', class: 'field' }));
app.appendChild(table);
run();
})();
</script>
