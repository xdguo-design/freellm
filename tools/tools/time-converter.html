<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('时间单位换算', '秒 / 分 / 时 / 天 / 周 / 年', 'time-converter');
var value = T.num(1, { style: 'width:130px' });
var from = T.select([{"value": "秒 (s)", "label": "秒 (s)"}, {"value": "毫秒 (ms)", "label": "毫秒 (ms)"}, {"value": "分 (min)", "label": "分 (min)"}, {"value": "小时 (h)", "label": "小时 (h)"}, {"value": "天 (d)", "label": "天 (d)"}, {"value": "周 (wk)", "label": "周 (wk)"}, {"value": "月 (30天)", "label": "月 (30天)"}, {"value": "年 (365天)", "label": "年 (365天)"}], "小时 (h)");
var to = T.select([{"value": "秒 (s)", "label": "秒 (s)"}, {"value": "毫秒 (ms)", "label": "毫秒 (ms)"}, {"value": "分 (min)", "label": "分 (min)"}, {"value": "小时 (h)", "label": "小时 (h)"}, {"value": "天 (d)", "label": "天 (d)"}, {"value": "周 (wk)", "label": "周 (wk)"}, {"value": "月 (30天)", "label": "月 (30天)"}, {"value": "年 (365天)", "label": "年 (365天)"}], "秒 (s)");
var output = T.input('', { class: 'grow mono', readonly: '' });
var table = T.el('div');
var U = {"秒 (s)": 1, "毫秒 (ms)": 0.001, "分 (min)": 60, "小时 (h)": 3600, "天 (d)": 86400, "周 (wk)": 604800, "月 (30天)": 2592000, "年 (365天)": 31536000};
function cv(v, f, t) {
  if (f === t) return v;
  return v * U[f] / U[t];
}
function run() {
  var v = +value.value;
  if (isNaN(v)) { output.value = ''; return; }
  output.value = +(cv(v, from.value, to.value).toPrecision(10));
  var rows = [];
  Object.keys(U).forEach(function (k) {
    rows.push([k, +(cv(v, from.value, k).toPrecision(8))]);
  });
  T.clearEl(table).appendChild(T.kvTable(rows));
}
[value, from, to].forEach(function (el) { el.addEventListener('input', run); });
app.appendChild(T.row([value, from, T.el('span', { text: '→' }), to, output]));
app.appendChild(T.el('span', { text: '换算到全部单位', class: 'field' }));
app.appendChild(table);
run();
})();
</script>
