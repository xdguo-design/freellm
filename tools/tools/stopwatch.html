<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线秒表 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('在线秒表', '开始/暂停/计次/复位', 'stopwatch');

  var display = T.el('div', { 
    style: 'font-size:3em;font-family:monospace;text-align:center;padding:20px;background:var(--bg);border-radius:12px;border:1px solid var(--line)',
    text: '00:00:00.000'
  });

  var laps = T.el('div', { class: 'output dark', style: 'max-height:200px;overflow-y:auto' });
  var lapList = [];

  var startBtn = T.button('开始', start, true);
  var lapBtn = T.button('计次', lap);
  var resetBtn = T.button('复位', reset);

  var startTime = 0;
  var elapsed = 0;
  var running = false;
  var timer = null;

  function formatTime(ms) {
    var hours = Math.floor(ms / 3600000);
    var minutes = Math.floor((ms % 3600000) / 60000);
    var seconds = Math.floor((ms % 60000) / 1000);
    var millis = ms % 1000;
    return String(hours).padStart(2, '0') + ':' +
           String(minutes).padStart(2, '0') + ':' +
           String(seconds).padStart(2, '0') + '.' +
           String(millis).padStart(3, '0');
  }

  function update() {
    elapsed = Date.now() - startTime;
    display.textContent = formatTime(elapsed);
  }

  function start() {
    if (running) {
      clearInterval(timer);
      running = false;
      startBtn.textContent = '继续';
    } else {
      startTime = Date.now() - elapsed;
      timer = setInterval(update, 10);
      running = true;
      startBtn.textContent = '暂停';
    }
  }

  function lap() {
    if (!running) return;
    lapList.unshift(elapsed);
    renderLaps();
  }

  function reset() {
    clearInterval(timer);
    running = false;
    elapsed = 0;
    startTime = 0;
    display.textContent = '00:00:00.000';
    startBtn.textContent = '开始';
    lapList = [];
    renderLaps();
  }

  function renderLaps() {
    var html = '<table style="width:100%;border-collapse:collapse">';
    html += '<thead><tr><th style="text-align:left;padding:4px">计次</th><th style="text-align:right;padding:4px">时间</th><th style="text-align:right;padding:4px">间隔</th></tr></thead>';
    html += '<tbody>';
    lapList.forEach(function (t, i) {
      var prev = lapList[i + 1] || 0;
      html += '<tr><td style="padding:4px;border-bottom:1px solid var(--line)">#' + (lapList.length - i) + '</td>';
      html += '<td style="padding:4px;border-bottom:1px solid var(--line);text-align:right;font-family:monospace">' + formatTime(t) + '</td>';
      html += '<td style="padding:4px;border-bottom:1px solid var(--line);text-align:right;font-family:monospace;color:var(--muted)">' + formatTime(t - prev) + '</td></tr>';
    });
    html += '</tbody></table>';
    laps.innerHTML = html;
  }

  app.appendChild(display);
  app.appendChild(T.el('div', { class: 'row', style: 'justify-content:center;gap:12px' }, [startBtn, lapBtn, resetBtn]));
  app.appendChild(T.el('div', { class: 'field', text: '计次记录:' }));
  app.appendChild(laps);
})();
</script>
</body>
</html>
