<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bionic Reading · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('Bionic Reading', '单词前部加粗提升阅读速度', 'bionic-reading');

  var ratio = T.el('input', { type: 'range', min: '20', max: '80', value: '50' });
  var ratioLabel = T.el('span', { text: '50%' });
  var input = T.textarea('输入文本...');
  var output = T.el('div', { class: 'output', style: 'line-height:2;word-wrap:break-word' });

  var copyBtn = T.copyBtn(function () { return output.textContent; });

  function run() {
    var v = input.value;
    var r = parseInt(ratio.value) / 100;
    ratioLabel.textContent = ratio.value + '%';
    if (!v) { output.innerHTML = ''; return; }

    output.innerHTML = v.replace(/(\S+)/g, function (word) {
      var len = word.length;
      var boldLen = Math.max(1, Math.ceil(len * r));
      return '<b>' + word.slice(0, boldLen) + '</b>' + word.slice(boldLen);
    });
  }

  ratio.addEventListener('input', run);
  input.addEventListener('input', function () { setTimeout(run, 100); });

  app.appendChild(T.el('div', { class: 'row' }, [
    T.el('span', { text: '加粗比例' }), ratio, ratioLabel, copyBtn
  ]));
  app.appendChild(T.el('div', { class: 'pane' }, [input]));
  app.appendChild(output);
})();
</script>
</body>
</html>
