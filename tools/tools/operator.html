<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('运算符优先级', '多语言运算符优先级参考表（JS / Python / C）', 'operator');
function buildSearch(tableWrap) {
  var search = T.input('', { class: 'grow', placeholder: '搜索过滤…' });
  search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase();
    Array.from(tableWrap.querySelectorAll('tbody tr')).forEach(function (tr) {
      tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
  return search;
}

var DATA = [
  ['()', '函数调用 / 分组', '最高', 'JS/Py/C'],
  ['[] . ?. (args)', '成员访问 / 可选链', '高', 'JS'],
  ['x++ x--', '后缀自增自减', '高', 'JS/C'],
  ['! ~ +x -x ++x --x typeof await', '一元运算符', '较高', 'JS/C'],
  ['**', '幂运算', '较高（右结合）', 'JS/Py'],
  ['* / % //', '乘除取模（// 为整除）', '中高', 'JS/Py/C'],
  ['+ -', '加减 / 字符串拼接', '中', 'JS/Py/C'],
  ['<< >>', '位移', '中', 'JS/C'],
  ['< <= > >= in instanceof', '比较 / 成员判断', '中', 'JS/Py'],
  ['== != === !==', '相等判断（=== 为严格相等）', '中低', 'JS'],
  ['&', '按位与', '低', 'JS/C'],
  ['^', '按位异或', '低', 'JS/C'],
  ['|', '按位或', '低', 'JS/C'],
  ['&& and', '逻辑与', '更低', 'JS/Py'],
  ['|| or', '逻辑或', '更低', 'JS/Py'],
  ['??', '空值合并', '低（不能与 || 混用不加括号）', 'JS'],
  ['? :', '三元条件', '很低', 'JS/C'],
  ['= += -= *= /= **= ????=', '赋值（右结合）', '很低', 'JS/Py/C'],
  ['yield', '生成器产出', '最低', 'JS/Py'],
  [',', '逗号 / 序列', '最低', 'JS/C']
];
var wrap = T.el('div');
wrap.appendChild(T.refTable(['运算符', '含义', '优先级', '语言'], DATA));
app.appendChild(T.row([buildSearch(wrap), T.el('span', { text: '规则：不确定时加括号；一元 ** 右结合；&& 高于 ||' })]));
app.appendChild(wrap);
})();
</script>
