<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻硬币 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('翻硬币', '随机决策', 'coin-flip');

  var coin = T.el('div', {
    style: 'width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg, #f39c12, #e67e22);display:flex;align-items:center;justify-content:center;font-size:3em;cursor:pointer;transition:transform 0.6s;box-shadow:0 8px 20px rgba(0,0,0,0.3)',
    text: '🪙',
    onclick: flip
  });

  var result = T.el('div', { class: 'badge', style: 'font-size:1.5em;text-align:center;margin:16px 0' });
  var stats = T.el('div', { class: 'output dark', style: 'text-align:center;padding:16px' });

  var heads = 0;
  var tails = 0;
  var flipping = false;

  function flip() {
    if (flipping) return;
    flipping = true;

    coin.style.transform = 'rotateY(1800deg)';
    result.textContent = '翻转中...';

    setTimeout(function () {
      var isHeads = Math.random() < 0.5;
      coin.style.transform = 'rotateY(0deg)';
      
      if (isHeads) {
        heads++;
        result.textContent = '正面！';
        result.style.color = '#f39c12';
      } else {
        tails++;
        result.textContent = '反面！';
        result.style.color = '#3498db';
        coin.style.transform = 'rotateY(180deg)';
      }

      stats.textContent = '正面: ' + heads + ' | 反面: ' + tails + ' | 总计: ' + (heads + tails);
      flipping = false;
    }, 600);
  }

  app.appendChild(T.el('div', { style: 'text-align:center' }, [coin]));
  app.appendChild(result);
  app.appendChild(stats);
})();
</script>
</body>
</html>
