<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>ASCII 艺术字 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">

</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/tools/js/lib-crypto.js"></script>
<script src="/tools/js/lib-format.js"></script>
<script src="/tools/js/lib-utils.js"></script>

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('ASCII 艺术字', 'FIGlet 风格大字：英文与数字转 5 行块状 ASCII 字符画', 'figlet');
var input = T.input('FreeLLM', { class: 'grow mono', placeholder: '输入英文 / 数字…' });
var fill = T.select(['█', '#', '@', '*', '$', '%'], '█');
var output = T.out('');
output.style.minHeight = '160px';
function run() {
  var r = LU.figlet(input.value, fill.value);
  output.value = r.art + (r.unknown.length ? '\n（未支持字符：' + r.unknown.join(' ') + '，以 ? 显示）' : '');
}
[input, fill].forEach(function (el) { el.addEventListener('input', run); });
app.appendChild(T.pane([T.field('文本', input)], true));
app.appendChild(T.row([T.el('span', { text: '填充字符' }), fill, T.btnCopy(function () { return output.value; })]));
app.appendChild(output);
run();
})();
</script>
