<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS 阴影生成器 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('CSS 阴影生成器', 'Box Shadow 可视化编辑', 'css-shadow');

  var x = T.el('input', { type: 'range', min: '-50', max: '50', value: '0' });
  var y = T.el('input', { type: 'range', min: '-50', max: '50', value: '10' });
  var blur = T.el('input', { type: 'range', min: '0', max: '100', value: '20' });
  var spread = T.el('input', { type: 'range', min: '-50', max: '50', value: '0' });
  var color = T.el('input', { type: 'color', value: '#000000' });
  var inset = T.el('label', { html: '<input type="checkbox"> 内阴影' });

  var preview = T.el('div', { 
    style: 'width:150px;height:150px;background:#fff;border-radius:12px;margin:20px auto;transition:box-shadow 0.2s'
  });

  var cssOutput = T.el('div', { class: 'output dark', style: 'font-family:monospace;white-space:pre-wrap;padding:12px' });
  var copyBtn = T.copyBtn(function () { return cssOutput.textContent; });

  function hexToRgba(hex, alpha) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function update() {
    var shadow = x.value + 'px ' + y.value + 'px ' + blur.value + 'px ' + spread.value + 'px ' + hexToRgba(color.value, 0.5);
    if (inset.querySelector('input').checked) shadow = 'inset ' + shadow;
    preview.style.boxShadow = shadow;
    cssOutput.textContent = 'box-shadow: ' + shadow + ';';
  }

  [x, y, blur, spread, color].forEach(function (el) { el.addEventListener('input', update); });
  inset.querySelector('input').addEventListener('change', update);

  var fields = [
    ['X 偏移', x], ['Y 偏移', y], ['模糊半径', blur], 
    ['扩展半径', spread], ['颜色', color]
  ];

  fields.forEach(function (f) {
    app.appendChild(T.el('div', { class: 'row' }, [T.el('span', { text: f[0], style: 'width:80px' }), f[1]]));
  });
  app.appendChild(inset);
  app.appendChild(preview);
  app.appendChild(T.el('div', { class: 'row' }, [cssOutput, copyBtn]));

  update();
})();
</script>
</body>
</html>
