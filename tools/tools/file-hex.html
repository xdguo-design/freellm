<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件与 Hex 互转 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('文件与 Hex 互转', '文件与十六进制字符串互转', 'file-hex');

  var mode = T.select([
    { value: 'toHex', label: '文件 → Hex' },
    { value: 'toFile', label: 'Hex → 文件' }
  ]);

  var fileBtn = T.button('选择文件', function () {
    T.readFile('/*', function (data, file) {
      var hex = Array.from(new Uint8Array(data)).map(function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
      output.value = hex;
      fileName.textContent = file.name + ' (' + file.size + ' bytes)';
    });
  }, true);

  var input = T.textarea('输入十六进制字符串...');
  var output = T.textarea('结果', false);
  output.readOnly = true;

  var fileName = T.el('span', { class: 'badge', text: '未选择文件' });
  var copyBtn = T.copyBtn(function () { return output.value; });
  var downloadBtn = T.button('下载文件', function () {
    var hex = output.value.replace(/\s/g, '');
    var bytes = new Uint8Array(hex.length / 2);
    for (var i = 0; i < bytes.length; i++) {
      bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
    }
    T.download('output.bin', bytes);
  });

  function run() {
    var v = input.value.trim();
    if (!v) { output.value = ''; return; }
    try {
      var clean = v.replace(/[^0-9a-fA-F]/g, '');
      if (clean.length % 2) throw new Error('Hex 长度必须为偶数');
      var bytes = new Uint8Array(clean.length / 2);
      for (var i = 0; i < bytes.length; i++) {
        bytes[i] = parseInt(clean.substr(i * 2, 2), 16);
      }
      output.value = new TextDecoder().decode(bytes);
    } catch (e) {
      output.value = '⚠ 转换失败: ' + e.message;
    }
  }

  mode.addEventListener('change', function () {
    if (mode.value === 'toHex') {
      input.placeholder = '请上方选择文件...';
      output.placeholder = '结果';
    } else {
      input.placeholder = '输入十六进制字符串...';
      output.placeholder = '文件内容';
    }
  });
  input.addEventListener('input', function () { setTimeout(run, 100); });

  app.appendChild(T.el('div', { class: 'row' }, [mode, fileBtn, fileName, copyBtn, downloadBtn]));
  app.appendChild(T.el('div', { class: 'pane' }, [input]));
  app.appendChild(T.el('div', { class: 'pane' }, [output]));
})();
</script>
</body>
</html>
