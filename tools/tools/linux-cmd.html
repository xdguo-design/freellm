  ['kill -l', '进程', '列出全部信号'],

var wrap = T.el('div');
wrap.appendChild(T.refTable(['命令', '分类', '说明'], DATA, function (r) { T.copy(r[0]); }));
app.appendChild(T.row([buildSearch(wrap), T.el('span', { text: '点击行复制命令' })]));
app.appendChild(wrap);
})();
