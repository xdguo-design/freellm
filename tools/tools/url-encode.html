<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL 编解码 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('URL 编解码', 'URL encode / decode 编码解码', 'url-encode');

  var mode = T.select([
    { value: 'encode', label: '编码' },
    { value: 'decode', label: '解码' },
    { value: 'encodeComponent', label: '编码(组件)' },
    { value: 'decodeComponent', label: '解码(组件)' }
  ]);
  var input = T.textarea('输入 URL 或编码后的字符串...');
  var output = T.textarea('结果', false);
  output.readOnly = true;

  var copyBtn = T.copyBtn(function () { return output.value; });

  function run() {
    var v = input.value;
    if (!v) { output.value = ''; return; }
    try {
      switch (mode.value) {
        case 'encode': output.value = encodeURI(v); break;
        case 'decode': output.value = decodeURI(v); break;
        case 'encodeComponent': output.value = encodeURIComponent(v); break;
        case 'decodeComponent': output.value = decodeURIComponent(v); break;
      }
    } catch (e) {
      output.value = '⚠ 解码失败: ' + e.message;
    }
  }

  mode.addEventListener('change', run);
  input.addEventListener('input', function () { setTimeout(run, 100); });

  app.appendChild(T.el('div', { class: 'row' }, [mode, copyBtn]));
  app.appendChild(T.el('div', { class: 'pane' }, [input]));
  app.appendChild(T.el('div', { class: 'pane' }, [output]));
})();
</script>
</body>
</html>
