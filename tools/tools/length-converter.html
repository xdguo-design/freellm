<div id="app"></div>

<script>
(function () {
'use strict';
var T = ToolCommon, LC = window.LC, LF = window.LibFormat, LU = window.LibU;
var app = T.head('长度单位换算', 'mm / cm / m / inch / ft / 尺寸', 'length-converter');
var value = T.num(1, { style: 'width:130px' });
var from = T.select([{"value": "m (米)", "label": "m (米)"}, {"value": "mm (毫米)", "label": "mm (毫米)"}, {"value": "cm (厘米)", "label": "cm (厘米)"}, {"value": "km (千米)", "label": "km (千米)"}, {"value": "in (英寸)", "label": "in (英寸)"}, {"value": "ft (英尺)", "label": "ft (英尺)"}, {"value": "yd (码)", "label": "yd (码)"}, {"value": "mi (英里)", "label": "mi (英里)"}, {"value": "nmi (海里)", "label": "nmi (海里)"}, {"value": "尺", "label": "尺"}, {"value": "寸", "label": "寸"}, {"value": "px (96dpi)", "label": "px (96dpi)"}], "cm (厘米)");
var to = T.select([{"value": "m (米)", "label": "m (米)"}, {"value": "mm (毫米)", "label": "mm (毫米)"}, {"value": "cm (厘米)", "label": "cm (厘米)"}, {"value": "km (千米)", "label": "km (千米)"}, {"value": "in (英寸)", "label": "in (英寸)"}, {"value": "ft (英尺)", "label": "ft (英尺)"}, {"value": "yd (码)", "label": "yd (码)"}, {"value": "mi (英里)", "label": "mi (英里)"}, {"value": "nmi (海里)", "label": "nmi (海里)"}, {"value": "尺", "label": "尺"}, {"value": "寸", "label": "寸"}, {"value": "px (96dpi)", "label": "px (96dpi)"}], "m (米)");
var output = T.input('', { class: 'grow mono', readonly: '' });
var table = T.el('div');
var U = {"m (米)": 1, "mm (毫米)": 0.001, "cm (厘米)": 0.01, "km (千米)": 1000, "in (英寸)": 0.0254, "ft (英尺)": 0.3048, "yd (码)": 0.9144, "mi (英里)": 1609.344, "nmi (海里)": 1852, "尺": 0.3333333333333333, "寸": 0.03333333333333333, "px (96dpi)": 0.0002645833};
function cv(v, f, t) {
  if (f === t) return v;
  return v * U[f] / U[t];
}
function run() {
  var v = +value.value;
  if (isNaN(v)) { output.value = ''; return; }
  output.value = +(cv(v, from.value, to.value).toPrecision(10));
  var rows = [];
  Object.keys(U).forEach(function (k) {
    rows.push([k, +(cv(v, from.value, k).toPrecision(8))]);
  });
  T.clearEl(table).appendChild(T.kvTable(rows));
}
[value, from, to].forEach(function (el) { el.addEventListener('input', run); });
app.appendChild(T.row([value, from, T.el('span', { text: '→' }), to, output]));
app.appendChild(T.el('span', { text: '换算到全部单位', class: 'field' }));
app.appendChild(table);
run();
})();
</script>
