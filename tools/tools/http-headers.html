<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTTP 请求头参考 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('HTTP 请求头参考', '常见请求头详解', 'http-headers');

  var search = T.el('input', { type: 'search', placeholder: '搜索请求头...', style: 'width:100%' });

  var HEADERS = [
    ['Accept', '客户端希望接收的响应内容类型', 'text/html, application/json'],
    ['Accept-Charset', '客户端可接受的字符集', 'utf-8, iso-8859-1'],
    ['Accept-Encoding', '客户端可接受的内容编码', 'gzip, deflate, br'],
    ['Accept-Language', '客户端可接受的语言', 'zh-CN, zh, en'],
    ['Authorization', 'HTTP认证凭证', 'Basic base64(user:pass)'],
    ['Cache-Control', '缓存控制指令', 'no-cache, max-age=3600'],
    ['Connection', '连接管理', 'keep-alive, close'],
    ['Content-Length', '请求体长度（字节）', '3495'],
    ['Content-Type', '请求体的MIME类型', 'application/json; charset=utf-8'],
    ['Cookie', '存储的Cookie', 'sessionId=abc123; userId=1'],
    ['DNT', '请勿跟踪', '1 (开启) / 0 (关闭)'],
    ['Expect', '客户端期望的服务器行为', '100-continue'],
    ['Host', '请求的目标主机和端口', 'www.example.com'],
    ['If-Modified-Since', '条件请求：资源修改时间', 'Wed, 21 Oct 2023 07:28:00 GMT'],
    ['If-None-Match', '条件请求：资源ETag', '"33a64df5"'],
    ['Origin', '跨域请求的来源', 'https://example.com'],
    ['Pragma', 'HTTP/1.0遗留缓存指令', 'no-cache'],
    ['Referer', '请求来源页面', 'https://example.com/page'],
    ['User-Agent', '客户端标识', 'Mozilla/5.0 ...'],
    ['X-Forwarded-For', '代理链IP地址', 'client, proxy1, proxy2'],
    ['X-Requested-With', 'AJAX请求标识', 'XMLHttpRequest']
  ];

  var table = T.el('div', { class: 'output dark' });

  function render(filter) {
    var q = (filter || '').toLowerCase();
    var filtered = HEADERS.filter(function (h) {
      if (!q) return true;
      return h[0].toLowerCase().includes(q) || h[1].toLowerCase().includes(q);
    });

    var html = '<table style="width:100%;border-collapse:collapse">';
    html += '<thead><tr><th style="text-align:left;padding:8px;border-bottom:1px solid var(--line)">头部</th><th style="text-align:left;padding:8px;border-bottom:1px solid var(--line)">描述</th><th style="text-align:left;padding:8px;border-bottom:1px solid var(--line)">示例值</th></tr></thead>';
    html += '<tbody>';
    filtered.forEach(function (h) {
      html += '<tr>';
      html += '<td style="padding:8px;border-bottom:1px solid var(--line)"><code style="color:var(--accent)">' + h[0] + '</code></td>';
      html += '<td style="padding:8px;border-bottom:1px solid var(--line)">' + h[1] + '</td>';
      html += '<td style="padding:8px;border-bottom:1px solid var(--line);font-family:monospace;font-size:0.9em">' + h[2] + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    table.innerHTML = html;
  }

  search.addEventListener('input', function () { render(search.value); });

  app.appendChild(search);
  app.appendChild(table);
  render();
})();
</script>
</body>
</html>
