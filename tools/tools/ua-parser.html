<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UA 解析 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('UA 解析', 'User-Agent 浏览器信息解析', 'ua-parser');

  var input = T.el('input', { type: 'text', value: navigator.userAgent, placeholder: '输入 User-Agent...', style: 'width:100%;font-family:monospace;font-size:0.9em' });
  var result = T.el('div', { class: 'output dark', style: 'padding:16px' });

  var copyBtn = T.copyBtn(function () { return result.textContent; });

  function parse(ua) {
    var info = {
      browser: 'Unknown',
      browserVersion: '',
      os: 'Unknown',
      osVersion: '',
      device: 'Desktop',
      engine: 'Unknown'
    };

    // Browser
    if (ua.includes('Firefox/')) { info.browser = 'Firefox'; info.browserVersion = ua.match(/Firefox\/([\d.]+)/)?.[1]; }
    else if (ua.includes('Edg/')) { info.browser = 'Edge'; info.browserVersion = ua.match(/Edg\/([\d.]+)/)?.[1]; }
    else if (ua.includes('Chrome/')) { info.browser = 'Chrome'; info.browserVersion = ua.match(/Chrome\/([\d.]+)/)?.[1]; }
    else if (ua.includes('Safari/') && ua.includes('Version/')) { info.browser = 'Safari'; info.browserVersion = ua.match(/Version\/([\d.]+)/)?.[1]; }
    else if (ua.includes('OPR/')) { info.browser = 'Opera'; info.browserVersion = ua.match(/OPR\/([\d.]+)/)?.[1]; }

    // Engine
    if (ua.includes('Gecko/')) info.engine = 'Gecko';
    else if (ua.includes('AppleWebKit/')) info.engine = 'WebKit/Blink';
    else if (ua.includes('Trident/')) info.engine = 'Trident';

    // OS
    if (ua.includes('Windows NT 10')) { info.os = 'Windows 10/11'; }
    else if (ua.includes('Windows NT 6.3')) { info.os = 'Windows 8.1'; }
    else if (ua.includes('Windows NT 6.1')) { info.os = 'Windows 7'; }
    else if (ua.includes('Mac OS X')) { info.os = 'macOS'; info.osVersion = ua.match(/Mac OS X ([\d_]+)/)?.[1]?.replace(/_/g, '.'); }
    else if (ua.includes('Linux')) { info.os = 'Linux'; }
    else if (ua.includes('Android')) { info.os = 'Android'; info.osVersion = ua.match(/Android ([\d.]+)/)?.[1]; }
    else if (ua.includes('iPhone') || ua.includes('iPad')) { info.os = 'iOS'; info.osVersion = ua.match(/OS ([\d_]+)/)?.[1]?.replace(/_/g, '.'); }

    // Device
    if (ua.includes('Mobile') || ua.includes('Android')) info.device = 'Mobile';
    else if (ua.includes('iPad') || ua.includes('Tablet')) info.device = 'Tablet';

    return info;
  }

  function run() {
    var ua = input.value.trim();
    if (!ua) { result.textContent = ''; return; }

    var info = parse(ua);
    result.innerHTML = '<table style="width:100%;border-collapse:collapse">' +
      '<tr><td style="padding:8px;color:var(--muted)">浏览器</td><td style="padding:8px"><strong>' + info.browser + '</strong> ' + (info.browserVersion || '') + '</td></tr>' +
      '<tr><td style="padding:8px;color:var(--muted)">引擎</td><td style="padding:8px">' + info.engine + '</td></tr>' +
      '<tr><td style="padding:8px;color:var(--muted)">操作系统</td><td style="padding:8px">' + info.os + ' ' + (info.osVersion || '') + '</td></tr>' +
      '<tr><td style="padding:8px;color:var(--muted)">设备类型</td><td style="padding:8px">' + info.device + '</td></tr>' +
      '</table>';
  }

  input.addEventListener('input', function () { setTimeout(run, 100); });

  app.appendChild(T.el('div', { class: 'row' }, [input, copyBtn]));
  app.appendChild(result);
  run();
})();
</script>
</body>
</html>
