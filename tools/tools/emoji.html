<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji 大全 · FreeLLM</title>
<link rel="stylesheet" href="/tools/css/tool.css">
</head>
<body>
<div id="app"></div>
<script src="/tools/js/tool-common.js"></script>
<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  var T = ToolCommon;
  var app = T.head('Emoji 大全', '分类浏览 Emoji，点击复制', 'emoji');

  var search = T.el('input', { type: 'search', placeholder: '搜索 Emoji...', style: 'width:100%' });

  var categories = {
    '😀 表情': '😀😃😄😁😆😅🤣😂🙂🙃😉😊😇🥰😍🤩😘😗😚😋😛😜🤪😝🤑🤗🤭🤫🤔🤐🤨😐😑😶😏😒🙄😬🤥😌😔😪🤤😴😷🤒🤕🤢🤮🤧🥵🥶🥴😵🤯🤠🥳🥸😎🤓🧐😕😟🙁😮😯😲😳🥺😦😧😨😰😥😢😭😱😖😣😞😓😩😫🥱😤😡😠🤬😈👿💀☠️💩🤡👹👺👻👽👾🤖😺😸😹😻😼😽🙀😿😾',
    '👋 手势': '👋🤚🖐✋🖖👌🤌🤏✌️🤞🤟🤘🤙👈👉👆🖕👇☝️👍👎✊👊🤛🤜👏🙌👐🤲🤝🙏✍️💅🤳💪🦾🦿🦵🦶👂🦻👃🧠🫀🫁🦷🦴👀👁👅👄',
    '❤️ 心形': '❤️🧡💛💚💙💜🖤🤍🤎💔❣️💕💞💓💗💖💘💝💟',
    '🐾 动物': '🐶🐱🐭🐹🐰🦊🐻🐼🐻‍❄️🐨🐯🦁🐮🐷🐸🐵🙈🙉🙊🐒🐔🐧🐦🐤🐣🐥🦆🦅🦉🦇🐺🐗🐴🦄🐝🪱🐛🦋🐌🐞🐜🪰🪲🪳🦟🦗🕷🕸🦂🐢🐍🦎🦖🦕🐙🦑🦐🦞🦀🐡🐠🐟🐬🐳🐋🦈🦭🐊🐅🐆🦓🦍🦧🐘🦛🦏🐪🐫🦒🦘🦬🐃🐂🐄🐎🐖🐏🐑🦙🐐🦌🐕🐩🦮🐈🪶🐓🦃🦤🦚🦜🦢🦩🕊🐇🦝🦨🦡🦫🦦🦥🐁🐀🐿🐾',
    '🍎 食物': '🍏🍎🍐🍊🍋🍌🍉🍇🍓🫐🍈🍒🍑🥭🍍🥥🥝🍅🍆🥑🥦🥬🥒🌶🫑🌽🥕🫒🧄🧅🥔🍠🫘🥐🥯🍞🥖🥨🧀🥚🍳🧈🥞🧇🥓🥩🍗🍖🦴🌭🍔🍟🍕🫓🥪🥙🧆🌮🌯🫔🥗🥘🥫🍝🍜🍲🍛🍣🍱🥟🦪🍤🍙🍚🍘🍥🥠🥮🍢🍡🍧🍨🍦🥧🧁🍰🎂🍮🍭🍬🍫🍿🍩🍪🌰🥜🍯🥛🍼🫖☕🍵🧃🥤🧋🍶🍺🍻🥂🍷🥃🍸🍹🧉🍾🧊🥄🍴🍽🥣🥡🥢🧂',
    '⚽ 活动': '⚽🏀🏈⚾🥎🎾🏐🏉🥏🎱🪀🏓🏸🏒🏑🥍🏏🪃🥅⛳🪁🏹🎣🤿🥊🥋🎽⛸🥌🛷🎿🎯🪀🪁🎮🎲🧩🎭🎨🧵🧶🎼🎵🎶🎙🎚🎛🎤🎧🎷🎸🎹🎺🎻🪕🥁🪘📱💻⌨️🖥🖨🖱🖲🕹🗜💽💾💿📀📼📷📸📹🎥📽🎞📞☎️📟📠📺📻🧭⏱⏲⏰🕰⌛⏳📡🔋🔌💡🔦🕯',
    '🏠 物品': '🧹🧺🧻🧼🧽🧯🛒🚬⚰️🪦⚱️🗿🏧🚮🚰♿🚹🚺🚻🚼🚾🛂🛃🛄🛅⚠️🚸⛔🚫🚳🚭🚯🚱🔞☢️☣️⬆️↗️➡️↘️⬇️↙️⬅️↖️↕️↔️↩️↪️⤴️⤵️🔃🔄🔙🔚🔛🔜.top⬆️↗️➡️↘️⬇️↙️⬅️↖️↕️↔️↩️↪️⤴️⤵️🔃🔄🔙🔚🔛🔜',
    '🔴 符号': '🔴🟠🟡🟢🔵🟣🟤⚫⚪🟥🟧🟨🟩🟦🟪🟫⬛⬜◼◻◽◾◽▪️▫️ Hive⬛⬜◼◻◽◾◽▪️▫️🔶🔷🔸🔹🔺🔻💠🔘🔳🔲🏁🚩🎌🏴🏳️🏴‍☠️🇨🇳🇨🇳',
    '🏁 国旗': '🏁🚩🎌🏴🏳️🏳️‍🌈🏳️‍⚧️🏴‍☠️'
  };

  var container = T.el('div');

  function render(filter) {
    var q = (filter || '').toLowerCase();
    var html = '';

    Object.keys(categories).forEach(function (cat) {
      var emojis = categories[cat].split('');
      var filtered = emojis.filter(function (e) {
        if (!q) return true;
        return cat.toLowerCase().includes(q) || e.includes(q);
      });

      if (filtered.length) {
        html += '<h3 style="margin:16px 0 8px;font-size:1em">' + cat + '</h3>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
        filtered.forEach(function (e) {
          html += '<div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.5em;border:1px solid var(--line);border-radius:4px;cursor:pointer" title="点击复制" onclick="navigator.clipboard.writeText(\'' + e + '\')">' + e + '</div>';
        });
        html += '</div>';
      }
    });

    container.innerHTML = html || '<p style="color:var(--muted)">未找到匹配的 Emoji</p>';
  }

  search.addEventListener('input', function () { render(search.value); });

  app.appendChild(search);
  app.appendChild(container);
  render();
})();
</script>
</body>
</html>
