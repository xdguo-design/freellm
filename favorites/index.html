:root {
  color-scheme: light;
  --canvas:#FBFBFA; --surface:#FFFFFF; --surface-soft:#F9F9F8;

[data-theme="dark"] {

  --ink:#ECEAE6; --ink2:#A7A5A0; --ink3:#6E6C68;
  --line:#26292F; --accent:#7BC0E5; --accent-soft:#0E2533;
  --card-shadow:0 2px 8px rgba(0,0,0,.3);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--canvas); color:var(--ink); font:400 15px/1.6 var(--font-sans); -webkit-font-smoothing:antialiased; }

header { display:flex; gap:16px; align-items:center; justify-content:space-between; padding:10px 0 20px; border-bottom:1px solid var(--line); }
.brand { display:flex; gap:10px; align-items:center; text-decoration:none; color:inherit; }
.brand-mark { display:grid; place-items:center; width:30px; height:30px; border-radius:8px; color:#fff; background:var(--accent); font-size:16px; }
h1 { font:400 34px/1.15 var(--font-serif); letter-spacing:-.02em; margin:36px 0 8px; }
.sub { color:var(--ink2); font-size:14px; margin:0 0 28px; }
.group-title { font:400 20px/1.3 var(--font-serif); margin:32px 0 12px; display:flex; align-items:center; gap:8px; }
.group-title small { color:var(--ink3); font:500 11px var(--font-mono); }
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.card { position:relative; display:flex; flex-direction:column; gap:4px; padding:14px 16px; border:1px solid var(--line); border-radius:8px; background:var(--surface); text-decoration:none; color:inherit; transition:box-shadow .2s, transform .2s; }
.card:hover { box-shadow:var(--card-shadow); transform:translateY(-1px); }
.card .name { font:500 14px/1.35 var(--font-mono); overflow-wrap:anywhere; }
.card .meta { color:var(--ink2); font-size:12px; }
.tag { display:inline-flex; padding:2px 8px; border-radius:9999px; background:var(--accent-soft); color:var(--accent); font:500 10px/1.7 var(--font-mono); align-self:flex-start; }
.empty { padding:48px 18px; text-align:center; color:var(--ink3); border:1px dashed var(--line); border-radius:8px; background:var(--surface); }
.actions { display:flex; gap:10px; margin:8px 0 24px; flex-wrap:wrap; }
.actions button { padding:8px 14px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); cursor:pointer; font-size:13px; }
.actions button:hover { border-color:var(--accent); color:var(--accent); }
.hist { display:flex; flex-direction:column; gap:6px; }
.hist-row { display:flex; gap:12px; align-items:center; padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:var(--surface); text-decoration:none; color:inherit; }
.hist-row .hn { font-weight:500; }
.hist-row .ht { margin-left:auto; color:var(--ink3); font:500 11px var(--font-mono); }
.hist-row .tag { font-size:9px; }
.cloud-note { margin-top:36px; padding:14px 16px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink2); font-size:13px; }
.cloud-note a { color:var(--accent); }
@media (max-width:760px) { .grid { grid-template-columns:repeat(2,1fr); } .page { padding:12px 18px 48px; } }
@media (max-width:520px) { .grid { grid-template-columns:1fr; } }

<script src="/js/freellm-sync.js"></script>
<script>
(function () {
  'use strict';
  var S = window.FreeLLM.Sync;
  var TYPES = [
    { id: 'model',    label: 'AI 模型',    icon: '🤖' },
    { id: 'provider', label: '厂家 / 平台', icon: '🏢' },
    { id: 'skill',    label: 'Skills',     icon: '🧩' },
    { id: 'tool',     label: '工具',       icon: '🔧' },
    { id: 'guide',    label: '指南',       icon: '📖' },
    { id: 'page',     label: '页面',       icon: '📄' }
  ];

  var content = document.getElementById('content');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function typeLabel(t) {
    var def = TYPES.find(function (x) { return x.id === t; });
    return def ? def.label : t;
  }
  function typeIcon(t) {
    var def = TYPES.find(function (x) { return x.id === t; });
    return def ? def.icon : '📄';
  }

  function render() {
    var favs = S.favs();
    var html = '';
    if (!favs.length) {
      html = '<div class="empty">还没有收藏。浏览各页面时点击卡片右上角的 ☆ 即可收藏。</div>';
    } else {
      // 分组：有定义的类型按序，其余归入「其他」
      var groups = {};
      favs.forEach(function (f) {
        var key = TYPES.some(function (t) { return t.id === f.type; }) ? f.type : 'other';
        (groups[key] = groups[key] || []).push(f);
      });
      TYPES.forEach(function (t) {
        var list = groups[t.id];
        if (!list || !list.length) return;
        delete groups[t.id];
        html += section(t.id, t.label, t.icon, list);
      });
      if (groups.other && groups.other.length) {
        html += section('other', '其他', '📄', groups.other);
      }
    }

    // 历史
    var hist = S.hist();
    if (hist.length) {
      html += '<h2 class="group-title">🕐 最近浏览 <small>' + hist.length + '</small></h2><div class="hist">';
      hist.slice(0, 30).forEach(function (h) {
        html += '<a class="hist-row" href="' + esc(h.url || '#') + '">' +
          '<span>' + typeIcon(h.type) + '</span>' +
          '<span class="hn">' + esc(h.name || h.id) + '</span>' +
          '<span class="tag">' + esc(typeLabel(h.type)) + '</span>' +
          '<span class="ht">' + new Date(h.ts).toLocaleString('zh-CN') + '</span></a>';
      });
      html += '</div>';
    }

    content.innerHTML = html;
    // 历史行也可追踪 + 星标
    S.bind(content);
  }

  function section(typeId, label, icon, list) {
    var html = '<h2 class="group-title">' + icon + ' ' + label + ' <small>' + list.length + '</small></h2><div class="grid">';
    list.forEach(function (f) {
      html += '<a class="card" href="' + esc(f.url || '#') + '" data-sync data-sync-type="' + esc(f.type) + '" data-sync-id="' + esc(f.id) + '" data-sync-name="' + esc(f.name) + '" data-sync-url="' + esc(f.url) + '" data-sync-star>' +
        '<span class="tag">' + esc(typeLabel(f.type)) + '</span>' +
        '<span class="name">' + esc(f.name || f.id) + '</span>' +
        '<span class="meta">收藏于 ' + new Date(f.ts).toLocaleDateString('zh-CN') + '</span>' +
        '</a>';
    });
    return html + '</div>';
  }

  // 连接按钮：复用模块的认证弹窗
  document.getElementById('btn-connect').addEventListener('click', function () {
    if (S.hasToken()) {
      S.getUser().then(function (u) {
        if (u && window.confirm('已连接为 ' + u.login + '。断开连接？')) S.setToken(null);
      });
    } else {
      S.authModal();
    }
  });
  document.getElementById('btn-push').addEventListener('click', function () {
    if (!S.hasToken()) { S.toast('请先连接 GitHub'); return; }
    S.pushNow().then(function () { S.toast('已推送到云端 Gist ✓'); })
      .catch(function (e) { S.toast('推送失败：' + e.message); });
  });
  document.getElementById('btn-pull').addEventListener('click', function () {
    if (!S.hasToken()) { S.toast('请先连接 GitHub'); return; }
    S.pullNow().then(function (ok) { S.toast(ok ? '已从云端拉取并合并 ✓' : '云端暂无数据'); })
      .catch(function (e) { S.toast('拉取失败：' + e.message); });
  });
  document.getElementById('btn-clear').addEventListener('click', function () {
    if (window.confirm('清空所有收藏？（历史保留）')) S.clearFavs();
  });

  S.on('fav', render);
  S.on('hist', render);
  S.on('auth', function () {
    document.getElementById('btn-connect').textContent = S.hasToken() ? 'GitHub 已连接' : '连接 GitHub 同步';
  });
  document.getElementById('btn-connect').textContent = S.hasToken() ? 'GitHub 已连接' : '连接 GitHub 同步';
  render();
})();
</script>
