<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="FreeLLM Agent Skill 固定任务实测产物，仅作为测试证据展示。"><meta name="robots" content="noindex,follow"><title>Refund Workflow Deck — FreeLLM Skill Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#f2f4f7;font-family:Arial,"PingFang SC",sans-serif;overflow:hidden}.deck{height:100vh}.slide{display:none;height:100vh;padding:7vw;position:relative}.slide.active{display:flex;flex-direction:column;justify-content:center}.n{position:absolute;top:28px;right:35px;font:700 12px monospace;color:#7dd3fc}h1{font-size:clamp(50px,9vw,130px);line-height:.9;letter-spacing:-.06em;margin:0;max-width:8ch}h2{font-size:clamp(40px,6vw,85px);margin:0 0 4vw}.accent{color:#7dd3fc}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.flow div{border-top:4px solid #7dd3fc;padding:22px 0;font-size:clamp(16px,2vw,28px)}.big{font-size:clamp(28px,5vw,72px);max-width:16ch}.hint{position:absolute;bottom:24px;left:7vw;font:12px monospace;color:#8b949e}</style></head><body><main class="deck"><section class="slide active"><span class="n">01 / 03</span><h1>Refund <span class="accent">without losing control.</span></h1><p class="big">把退费拆成资格校验、药房阻塞、退款执行和状态恢复。</p><span class="hint">← → 切换页面 · FreeLLM 实测</span></section><section class="slide"><span class="n">02 / 03</span><h2>One path, four gates.</h2><div class="flow"><div>01<br><b>Eligibility</b></div><div>02<br><b>Pharmacy</b></div><div>03<br><b>Refund</b></div><div>04<br><b>Recover</b></div></div><span class="hint">← → 切换页面</span></section><section class="slide"><span class="n">03 / 03</span><h2>Ship the observable path first.</h2><p class="big"><span class="accent">先把阻塞原因记录下来，</span>再决定下一轮规则细化。</p><span class="hint">← → 切换页面</span></section></main><script>const slides=[...document.querySelectorAll('.slide')];let i=0;addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;slides[i].classList.remove('active');i=(i+(e.key==='ArrowRight'?1:-1)+slides.length)%slides.length;slides[i].classList.add('active')})</script></body></html>
