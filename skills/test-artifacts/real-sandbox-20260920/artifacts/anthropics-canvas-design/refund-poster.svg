<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#F4EFE4"/><text x="80" y="100" font-family="Georgia" font-size="58" fill="#17324D">REFUND / RECOVERY</text><text x="82" y="145" font-family="sans-serif" font-size="20" fill="#65717A">A state machine is also a promise to recover.</text><path d="M100 340 H1080" stroke="#17324D" stroke-width="4"/><g font-family="sans-serif" font-size="24" fill="#17324D"><circle cx="180" cy="340" r="42" fill="#DCE8F2"/><text x="138" y="348">READY</text><circle cx="480" cy="340" r="42" fill="#F4D8A6"/><text x="415" y="348">PROCESS</text><circle cx="780" cy="340" r="42" fill="#D7E8D6"/><text x="730" y="348">DONE</text><circle cx="1030" cy="340" r="42" fill="#F0C9C5"/><text x="975" y="348">UNKNOWN</text></g><text x="80" y="600" font-family="sans-serif" font-size="22" fill="#56636E">Never collapse UNKNOWN into FAILED.</text></svg>