<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="FreeLLM Agent Skill 固定任务实测产物，仅作为测试证据展示。"><meta name="robots" content="noindex,follow"><title>Markdown to HTML — FreeLLM Skill Test</title><style>body{margin:0;background:#edf0ec;color:#232825;font-family:"PingFang SC",system-ui,sans-serif}.article{max-width:720px;margin:0 auto;background:white;min-height:100vh;padding:68px 52px}.eyebrow{color:#5c756a;font-size:13px;font-weight:700}h1{font-family:Georgia,"Noto Serif SC",serif;font-size:46px;line-height:1.08;margin:14px 0 30px}p{font-size:17px;line-height:1.9;color:#3f4844}blockquote{margin:32px 0;border-left:4px solid #345c4f;padding:14px 22px;background:#f1f6f3;color:#29443a}h2{margin-top:42px;font-size:24px}.note{margin-top:55px;padding-top:18px;border-top:1px solid #dfe5e1;color:#718079;font-size:12px}@media(max-width:600px){.article{padding:40px 24px}h1{font-size:36px}}</style></head><body><article class="article"><div class="eyebrow">FreeLLM 实测 · Markdown → HTML</div><h1>门诊退费，真正难的不是“点退款”</h1><p>一个看起来只有一个按钮的动作，背后通常跨过收费、药房、支付渠道和状态恢复。把这些差异藏在弹窗里，开发最终只能靠猜。</p><blockquote>更好的做法，是先把每个动作落到明确状态：什么条件能退、谁会阻塞、处理中怎么恢复、未知状态怎么追查。</blockquote><h2>从页面动作开始，而不是从数据库字段开始</h2><p>先定义用户真正会点的动作，再把 ACT、功能 ID、状态机、Legacy 与 V2 映射到同一条证据链。这样 UI、PRD 和代码核验能说同一种语言。</p><div class="note">当前为 FreeLLM 替代执行产物；没有运行该仓库原始转换脚本，因此标记为部分通过。</div></article></body></html>
