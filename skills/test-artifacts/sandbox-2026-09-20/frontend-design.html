<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门诊退费 · 状态工作台</title><meta name="description" content="FreeLLM frontend-design Skill 的真实沙箱产物：门诊退费状态工作台，展示 INIT、PROCESSING、SUCCESS、FAILED、UNKNOWN 与恢复路径。"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://freellm.top/skills/test-artifacts/sandbox-2026-09-20/frontend-design.html"><style>
:root{--ink:#1a1d1b;--paper:#f3efe6;--line:#c9c1b4;--amber:#e9a034;--green:#347d60;--red:#b5524b;--slate:#6f7480;--muted:#756e64}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans CJK SC",system-ui,sans-serif}main{min-height:100vh;display:grid;grid-template-columns:minmax(280px,34vw) 1fr}.rail{border-right:1px solid var(--line);padding:46px 42px 34px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow{font:700 12px/1.2 ui-monospace,monospace;letter-spacing:.08em;color:#8c6426}.rail h1{font-size:clamp(38px,5vw,72px);line-height:.98;margin:18px 0 22px;letter-spacing:-.045em;max-width:6ch}.rail p{font-size:15px;line-height:1.8;color:var(--muted);max-width:28em}.privacy{border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}.stage{padding:34px 42px 40px;display:grid;grid-template-rows:auto auto 1fr;gap:24px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center}.clock{font:600 13px ui-monospace,monospace;color:var(--muted)}.actions{display:flex;gap:8px}.actions button{border:1px solid var(--ink);background:transparent;padding:10px 14px;font-weight:700;cursor:pointer}.actions button:focus-visible{outline:3px solid #111;outline-offset:3px}.state-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.state{min-height:96px;border-top:8px solid var(--line);padding:14px 12px 10px;background:rgba(255,255,255,.22);cursor:pointer;text-align:left}.state b{display:block;font:700 14px ui-monospace,monospace}.state small{display:block;margin-top:20px;color:var(--muted)}.state[data-s="PROCESSING"]{border-color:var(--amber)}.state[data-s="SUCCESS"]{border-color:var(--green)}.state[data-s="FAILED"]{border-color:var(--red)}.state[data-s="UNKNOWN"]{border-color:var(--slate)}.state.active{background:#1a1d1b;color:#fff}.state.active small{color:#d9d4ca}.workspace{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;min-height:0}.queue,.detail{border-top:1px solid var(--ink);padding-top:14px}.queue h2,.detail h2{font-size:16px;margin:0 0 16px}.row{display:grid;grid-template-columns:92px 1fr 110px 90px;gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.pill{font:700 11px ui-monospace,monospace}.money{text-align:right;font-variant-numeric:tabular-nums}.detailbox{background:#1a1d1b;color:#fff;padding:22px;min-height:260px}.detailbox .big{font:700 clamp(32px,4vw,54px)/1 ui-monospace,monospace}.detailbox p{color:#d9d4ca;line-height:1.7}.recovery{margin-top:20px;border-top:1px solid #555;padding-top:16px}.recovery button{width:100%;padding:12px;border:0;background:var(--amber);font-weight:800;cursor:pointer}.statusline{margin-top:12px;font-size:12px;color:#aaa;min-height:1.3em}@media(max-width:860px){main{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line);padding:26px 22px}.rail h1{max-width:none;font-size:42px}.stage{padding:22px}.workspace{grid-template-columns:1fr}.state-strip{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:74px 1fr 90px}.row .money{grid-column:3}.row .channel{display:none}}
</style></head><body><main><aside class="rail"><section><div class="eyebrow">REFUND / CONTROL DESK</div><h1>退费不是一个按钮。</h1><p>把处理中、失败和未知状态留在台面上。收费员看到的是下一步动作，而不是“系统异常”。</p></section><div class="privacy">候诊区屏幕不展示身份证号、手机号或完整就诊号。当前数据为测试夹具。</div></aside><section class="stage"><div class="topline"><div class="clock" id="clock">2026-09-20 23:04</div><div class="actions"><button id="allBtn">全部</button><button id="exceptionBtn">只看异常</button></div></div><div class="state-strip" id="states"><button class="state" data-s="INIT"><b>INIT</b><small>待发起</small></button><button class="state active" data-s="PROCESSING"><b>PROCESSING</b><small>处理中</small></button><button class="state" data-s="SUCCESS"><b>SUCCESS</b><small>成功</small></button><button class="state" data-s="FAILED"><b>FAILED</b><small>失败</small></button><button class="state" data-s="UNKNOWN"><b>UNKNOWN</b><small>未知</small></button></div><div class="workspace"><section class="queue"><h2>待处理队列</h2><div id="rows"></div></section><aside class="detail"><h2>当前记录</h2><div class="detailbox"><div class="big" id="detailState">PROCESSING</div><p id="detailText">渠道已受理，等待回调。此时禁止再次发起退费。</p><div class="recovery"><div id="recoveryText">恢复路径：轮询 → 超时转 UNKNOWN → 主动查单</div><button id="recoverBtn">执行恢复检查</button><div class="statusline" id="statusline"></div></div></div></aside></div></section></main><script>
const data=[['R001','张三','PROCESSING',120,'WeChat'],['R002','李四','SUCCESS',80.5,'Alipay'],['R003','王五','FAILED',200,'BankCard'],['R004','赵六','UNKNOWN',60,'WeChat'],['R005','钱七','INIT',150,'Cash']];let filter='PROCESSING';const rows=document.querySelector('#rows');function render(){rows.innerHTML='';data.filter(r=>filter==='ALL'||filter==='EX'?(r[2]==='FAILED'||r[2]==='UNKNOWN'):r[2]===filter).forEach(r=>{const d=document.createElement('button');d.className='row';d.style='width:100%;background:none;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer';d.innerHTML=`<span class="pill">${r[0]}</span><span>${r[1]}</span><span class="channel">${r[4]}</span><span class="money">¥${r[3].toFixed(2)}</span>`;d.onclick=()=>show(r[2]);rows.appendChild(d)})}function show(s){document.querySelectorAll('.state').forEach(x=>x.classList.toggle('active',x.dataset.s===s));document.querySelector('#detailState').textContent=s;const t={INIT:['待发起，尚未调用支付渠道。','发起退费 → PROCESSING'],PROCESSING:['渠道已受理，等待回调。此时禁止再次发起退费。','轮询 → 超时转 UNKNOWN → 主动查单'],SUCCESS:['退费已完成，不允许再次操作。','只读归档'],FAILED:['渠道明确失败，可按失败码决定是否重试。','修正原因 → 重试 / 人工处理'],UNKNOWN:['结果不可确认，不能直接二次退费。','主动查单 → 对账 → 人工兜底']}[s];document.querySelector('#detailText').textContent=t[0];document.querySelector('#recoveryText').textContent='恢复路径：'+t[1]}document.querySelectorAll('.state').forEach(b=>b.onclick=()=>{filter=b.dataset.s;show(filter);render()});document.querySelector('#allBtn').onclick=()=>{filter='ALL';render()};document.querySelector('#exceptionBtn').onclick=()=>{filter='EX';render()};document.querySelector('#recoverBtn').onclick=()=>{document.querySelector('#statusline').textContent='已执行：查单请求 #Q-20260920-2304，等待渠道结果';console.log('recovery-check',document.querySelector('#detailState').textContent)};render();
</script></body></html>
